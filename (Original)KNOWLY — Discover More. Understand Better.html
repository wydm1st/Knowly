  var html=pageHead(_('My progress','Мой прогресс','Mening natijalarim'),_('See how your knowledge grows: streaks, levels, quiz scores and study time. Everything is stored privately in this browser.','Смотрите, как растут ваши знания: серии, уровни, баллы за тесты и время занятий. Всё хранится приватно в этом браузере.','Bilimingiz qanday o‘sayotganini ko‘ring: ketma-ket kunlar, darajalar, test ballari va o‘qish vaqti. Hammasi shu brauzerda maxfiy saqlanadi.'))+
  '<section class="s"><div class="wrap">'+banner+
  '<div class="stats">'+stat(S.xp+' XP',_('Level ','Уровень ','Daraja ')+(lv.i+1)+' · '+esc(lv.name))+stat(S.streak,_('day streak','дней подряд','kun ketma-ket'))+stat(S.reads+' / '+ARTICLES.length,_('articles read','статей прочитано','maqola o‘qilgan'))+stat(S.quizzes?S.avg+'%':'—',_('average quiz score','средний балл за тесты','o‘rtacha test bali')+' · '+S.quizzes)+stat(S.study,_('minutes studied','минут занятий','daqiqa o‘qilgan'))+'</div>'+
  '<div class="dgrid"><div class="pcard"><h3>'+_('Activity, last 14 days','Активность за 14 дней','Faollik, so‘nggi 14 kun')+'</h3><p class="sub">'+_('Articles read and quizzes taken each day.','Прочитанные статьи и пройденные тесты по дням.','Har kuni o‘qilgan maqolalar va topshirilgan testlar.')+'</p>'+barsSVG(act,lab,_('Bar chart of activity over the last 14 days','Столбчатая диаграмма активности за 14 дней','So‘nggi 14 kun faolligi diagrammasi'))+legend+'</div>'+
  '<div class="pcard"><h3>'+_('Level & weekly goal','Уровень и цель недели','Daraja va haftalik maqsad')+'</h3><p class="sub">'+_('Earn XP by reading, quizzing and studying.','Получайте XP за чтение, тесты и занятия.','O‘qish, test va mashg‘ulot uchun XP to‘plang.')+'</p><div class="ringwrap">'+ringSVG(lv.pct,104,_('Lv','Ур.','Dr.')+' '+(lv.i+1))+ringSVG(Math.min(1,wk/(src.goal||3)),104,wk+'/'+(src.goal||3))+'</div><p class="sub" style="margin-top:12px">'+(lv.to?(lv.to-S.xp)+' XP '+_('to the next level','до следующего уровня','keyingi darajagacha'):_('Top level reached!','Максимальный уровень!','Eng yuqori daraja!'))+'</p>'+(demo?'':'<label style="display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted)">'+_('Weekly goal (articles):','Цель недели (статьи):','Haftalik maqsad (maqola):')+'<select data-goal>'+[1,2,3,4,5,7,10].map(function(g){return '<option'+(g===P.goal?' selected':'')+'>'+g+'</option>'}).join('')+'</select></label>')+'</div></div>'+
  '<div class="dgrid two"><div class="pcard"><h3>'+_('Quiz score trend','Динамика результатов тестов','Test natijalari dinamikasi')+'</h3><p class="sub">'+_('Your last 12 quiz results. Going up means you are learning.','Последние 12 результатов. Рост означает, что вы учитесь.','So‘nggi 12 ta natija. O‘sish — o‘rganayotganingiz belgisi.')+'</p>'+(scores.length?lineSVG(scores,_('Line chart of quiz scores','Линейный график баллов','Test ballari grafigi')):'<div class="empty" style="padding:28px">'+empty+'</div>')+'</div>'+
  '<div class="pcard"><h3>'+_('Mastery by topic','Освоение по темам','Mavzular bo‘yicha o‘zlashtirish')+'</h3><p class="sub">'+_('Share of correct answers per topic.','Доля верных ответов по темам.','Har bir mavzu bo‘yicha to‘g‘ri javoblar ulushi.')+'</p>'+(mastery.length?mastery.map(function(m){return '<div class="mbar"><span>'+esc(catName(m.c))+'</span><div class="tr"><i style="width:'+m.p+'%"></i></div><b>'+m.p+'%</b></div>'}).join(''):'<div class="empty" style="padding:28px">'+empty+'</div>')+'</div></div>'+
  '<div class="dgrid two"><div class="pcard"><h3>'+_('Study time, last 7 days','Время занятий за 7 дней','O‘qish vaqti, so‘nggi 7 kun')+'</h3><p class="sub">'+_('Minutes recorded by the study timer.','Минуты, записанные таймером занятий.','O‘qish taymeri yozgan daqiqalar.')+'</p>'+barsSVG(sd,sl,_('Bar chart of study minutes','Диаграмма минут занятий','O‘qish daqiqalari diagrammasi'))+'<p style="margin-top:8px"><a class="more" href="#/tools/timer">'+_('Open the study timer','Открыть таймер','Taymerni ochish')+'</a></p></div>'+
  '<div class="pcard"><h3>'+_('Recent quizzes','Недавние тесты','So‘nggi testlar')+'</h3><p class="sub">'+_('Your latest saved results.','Ваши последние сохранённые результаты.','Eng so‘nggi saqlangan natijalaringiz.')+'</p>'+(hist.length?'<table class="hist"><thead><tr><th>'+_('Date','Дата','Sana')+'</th><th>'+_('Quiz','Тест','Test')+'</th><th>'+_('Score','Балл','Ball')+'</th></tr></thead><tbody>'+hist.map(function(q){return '<tr><td>'+fmt(q.d)+'</td><td>'+esc(quizTitle(q.id))+'</td><td><b>'+q.s+'/'+q.n+'</b></td></tr>'}).join('')+'</tbody></table>':'<div class="empty" style="padding:28px">'+empty+'</div>')+'</div></div>'+
  '<div class="sec-head" style="margin-top:38px"><div><h2>'+_('Badges','Бейджи','Nishonlar')+'</h2></div></div><div class="badges">'+BADGES.map(function(b){var on=demo?b.test(S):!!P.badges[b.id];return '<div class="bdg'+(on?'':' lock')+'"><span class="bi">'+ico(on?'trophy':'spark',22)+'</span><b>'+esc(X(b.n))+'</b><span>'+esc(X(b.d))+'</span></div>'}).join('')+'</div>'+
  (demo?'':'<div class="pcard" style="margin-top:38px"><h3>'+_('Backup & restore','Резервная копия и восстановление','Zaxira nusxa va tiklash')+'</h3><p class="sub">'+_('Your data lives only in this browser. Copy the text below to move it to another device, and paste it back here to restore.','Ваши данные хранятся только в этом браузере. Скопируйте текст ниже, чтобы перенести на другое устройство, и вставьте обратно для восстановления.','Ma’lumotlaringiz faqat shu brauzerda saqlanadi. Boshqa qurilmaga ko‘chirish uchun quyidagi matnni nusxalang, tiklash uchun esa bu yerga qaytarib qo‘ying.')+'</p><textarea class="bk" id="bkText" spellcheck="false" aria-label="Backup">'+esc(JSON.stringify({knowly:2,saved:saved,prog:P}))+'</textarea><div class="drow" style="margin-top:12px"><button type="button" class="btn ghost small" data-act="copybk">'+_('Copy backup','Копировать копию','Nusxalash')+'</button><button type="button" class="btn ghost small" data-act="restore">'+_('Restore from text','Восстановить из текста','Matndan tiklash')+'</button><button type="button" class="btn ghost small" data-act="reset" style="margin-left:auto">'+_('Reset all progress','Сбросить весь прогресс','Barcha natijalarni tozalash')+'</button></div></div>')+
  '</div></section>';
  return {title:_('My progress','Мой прогресс','Mening natijalarim')+' — KNOWLY',html:html};
}

/* ================= router ================= */
var app=$('#app'),cleanups=[],current='';
function setupReveal(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!('IntersectionObserver' in window))return;
  document.documentElement.classList.add('jsr');
  var els=$$('#app section.s > .wrap > *');els.forEach(function(el){el.setAttribute('data-r','')});
  var io=new IntersectionObserver(function(en){en.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{rootMargin:'0px 0px -5% 0px'});
  els.forEach(function(el){io.observe(el)});
  setTimeout(function(){els.forEach(function(el){el.classList.add('in')})},1800);
  cleanups.push(function(){io.disconnect()});
}
function render(keep){
  cleanups.forEach(function(c){try{c()}catch(e){}});cleanups=[];
  var h=location.hash.replace(/^#\/?/,''),parts=h.split('/'),name=parts[0]||'',arg=parts.slice(1).join('/'),v;
  switch(name){
    case '':v=viewHome();break;
    case 'news':v=viewNews();break;
    case 'books':v=viewBooks();break;
    case 'articles':v=viewArticles();break;
    case 'article':v=viewArticle(arg);break;
    case 'tech':v=viewTech();break;
    case 'space':v=viewSpace();break;
    case 'explore':v=viewExplore();break;
    case 'categories':v=viewCategories();break;
    case 'category':v=viewCategory(arg);break;
    case 'saved':v=viewSaved();break;
    case 'search':v=viewSearch(arg);break;
    case 'quiz':v=arg?viewQuiz(arg):viewQuizHub();break;
    case 'tools':v=viewTools(arg||'deck');break;
    case 'progress':v=viewProgress();break;
    default:v=viewNotFound();
  }
  current=name+(name==='tools'?'/'+(arg||'deck'):'');
  app.innerHTML=v.html;document.title=v.title.replace(/&#39;|&amp;/g,"'");
  var nk=name==='article'?'articles':name;
  $$('#nav a[data-r]').forEach(function(a){if(a.dataset.r===nk)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  var hd=$('#siteHeader');hd.classList.remove('open');var mb=$('#menuBtn');if(mb)mb.setAttribute('aria-expanded','false');
  if(v.after){var r=v.after();if(typeof r==='function')cleanups.push(r)}
  setupReveal();syncSaveUI();syncChrome();paintTimer(tRem());
  if(!keep){window.scrollTo(0,0);var t=$('#pgTitle');if(t&&t.focus)t.focus({preventScroll:true})}
}
function syncSaveUI(){$$('[data-save]').forEach(function(b){var on=isSaved(b.dataset.save);b.setAttribute('aria-pressed',on);b.lastChild.textContent=on?(b.dataset.remove==='1'?_('Remove','Удалить','O‘chirish'):_('Saved','Сохранено','Saqlandi')):_('Save','Сохранить','Saqlash')})}
function setLang(l){
  if(l===LANG)return;stopSpeak();applyLang(l);sset('knowly.lang',l);P.langs[l]=1;saveP();renderChrome();render(true);checkBadges();
}
var confirmReset=0;
function act(name,el){
  var root=document.documentElement;
  if(name==='theme'){var next=root.getAttribute('data-theme')==='light'?'dark':'light';root.setAttribute('data-theme',next);sset('knowly.v2.theme',next)}
  else if(name==='random'){var a=ARTICLES[Math.floor(Math.random()*ARTICLES.length)];location.hash='#/article/'+a.slug}
  else if(name==='fs-'||name==='fs+'){var fs=sget('knowly.fs',1);fs=Math.max(.9,Math.min(1.45,Math.round((fs+(name==='fs+'?.1:-.1))*100)/100));sset('knowly.fs',fs);var ar=$('#art');if(ar)ar.style.setProperty('--ps',fs)}
  else if(name==='speak'){var s=location.hash.split('/')[2],a2=artBySlug(s);if(a2)toggleSpeak(a2,el)}
  else if(name==='share'){var t=document.title;if(navigator.share){navigator.share({title:t,url:location.href}).catch(function(){})}else copyText(location.href,_('Link copied','Ссылка скопирована','Havola nusxalandi'))}
  else if(name==='demo'){demo=true;render(true)}
  else if(name==='demo-off'){demo=false;render(true)}
  else if(name==='copybk'){copyText($('#bkText').value,_('Backup copied','Копия скопирована','Nusxa olindi'))}
  else if(name==='restore'){
    try{var o=JSON.parse($('#bkText').value);if(!o||o.knowly!==2||!o.prog)throw 0;saved=Array.isArray(o.saved)?o.saved:[];sset(SK,saved);var np=o.prog;np.read=np.read||{};np.quiz=Array.isArray(np.quiz)?np.quiz:[];np.study=np.study||{};np.known=np.known||[];np.langs=np.langs||{};np.goal=np.goal||3;np.badges=np.badges||{};P=np;saveP();toast(_('Progress restored','Прогресс восстановлен','Natijalar tiklandi'));render(true);syncChrome()}
    catch(e){toast(_('That text is not a valid KNOWLY backup','Этот текст не является резервной копией KNOWLY','Bu matn yaroqli KNOWLY zaxira nusxasi emas'))}
  }
  else if(name==='reset'){
    if(!confirmReset){confirmReset=1;el.textContent=_('Click again to confirm','Нажмите ещё раз для подтверждения','Tasdiqlash uchun yana bosing');setTimeout(function(){confirmReset=0;if(el.isConnected)el.textContent=_('Reset all progress','Сбросить весь прогресс','Barcha natijalarni tozalash')},4000)}
    else{confirmReset=0;P={read:{},quiz:[],study:{},known:[],langs:{},goal:3,badges:{}};P.langs[LANG]=1;saveP();saved=[];sset(SK,saved);toast(_('Progress reset','Прогресс сброшен','Natijalar tozalandi'));render(true);syncChrome()}
  }
}
document.addEventListener('click',function(e){
  var t=e.target,b;
  if((b=t.closest('[data-save]'))){toggleSave(b.dataset.save);if(current==='saved')render(true);else syncSaveUI();return}
  if((b=t.closest('[data-lang]'))){setLang(b.dataset.lang);return}
  if((b=t.closest('[data-act]'))){act(b.dataset.act,b);return}
  if((b=t.closest('[data-tm]'))){var m=b.dataset.tm;if(m==='start')timerStart();else if(m==='pause')timerPause();else if(m==='reset')timerReset();else if(m==='save')timerSave();else if(m==='set'){T.mins=+b.dataset.v;drawTimer()}return}
  if((b=t.closest('#factBtn'))){var i=(parseInt(b.dataset.fi,10)+1)%FACTS.length;b.dataset.fi=i;$('#factText').textContent=X(FACTS[i]);$('.fact .num').textContent=i+1;return}
  if((b=t.closest('#menuBtn'))){var hd=$('#siteHeader'),o=hd.classList.toggle('open');b.setAttribute('aria-expanded',o);return}
});
document.addEventListener('change',function(e){var g=e.target.closest&&e.target.closest('[data-goal]');if(g){P.goal=parseInt(g.value,10)||3;saveP();render(true)}});
document.addEventListener('keydown',function(e){if(e.key==='/'&&!/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||''))){e.preventDefault();location.hash='#/search/'}});
window.addEventListener('hashchange',function(){render()});

/* ================= init ================= */
(function(){
  var sl=sget('knowly.lang',null);
  if(LANGS.indexOf(sl)<0){var nl=(navigator.language||'en').toLowerCase();sl=nl.indexOf('uz')===0?'uz':nl.indexOf('ru')===0?'ru':'en'}
  applyLang(sl);P.langs[LANG]=1;saveP();
  var th=sget('knowly.v2.theme',null);if(th==='light'||th==='dark')document.documentElement.setAttribute('data-theme',th);
  renderChrome();render();checkBadges();
  if(T.run)paintTimer(tRem());
})();
})();
</script>
</body>
</html>
