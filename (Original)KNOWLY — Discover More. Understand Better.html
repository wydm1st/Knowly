 Pp("A large language model (LLM) is a program trained to predict what text comes next. It reads text as small chunks called tokens. For a given sequence, it calculates a probability for every possible next token, picks one, adds it, and repeats.","Большая языковая модель (LLM) — это программа, обученная предсказывать, какой текст идёт дальше. Она читает текст небольшими фрагментами — токенами. Для заданной последовательности она вычисляет вероятность каждого возможного следующего токена, выбирает один, добавляет его и повторяет.","Katta til modeli (LLM) — keyingi matn qanday bo‘lishini taxmin qilishga o‘rgatilgan dastur. U matnni token deb ataladigan mayda bo‘laklar sifatida o‘qiydi. Berilgan ketma-ketlik uchun har bir mumkin bo‘lgan keyingi tokenning ehtimolini hisoblaydi, bittasini tanlaydi, qo‘shadi va jarayonni takrorlaydi."),
 H("Where the skill comes from","Откуда берётся умение","Qobiliyat qayerdan keladi"),
 Pp("Inside is a neural network with billions of adjustable numbers called parameters. During training, it sees enormous amounts of text and is nudged again and again to predict better. Most modern models use the transformer design, introduced in 2017 in the paper “Attention Is All You Need.”","Внутри находится нейронная сеть с миллиардами настраиваемых чисел — параметров. Во время обучения она видит огромные объёмы текста и снова и снова корректируется, чтобы предсказывать лучше. Большинство современных моделей используют архитектуру трансформера, представленную в 2017 году в статье «Attention Is All You Need».","Ichkarida milliardlab sozlanadigan sonlar — parametrlarga ega neyron tarmoq bor. O‘qitish davomida u juda katta hajmdagi matnni ko‘radi va yaxshiroq taxmin qilishi uchun qayta-qayta tuzatiladi. Zamonaviy modellarning ko‘pchiligi 2017-yilda “Attention Is All You Need” maqolasida taqdim etilgan transformer arxitekturasidan foydalanadi."),
 H("Strengths and limits","Сильные стороны и ограничения","Kuchli tomonlari va cheklovlari"),
 Pp("LLMs are good at drafting, summarizing, translating and explaining. They can also state wrong things confidently, called hallucination, because producing plausible text is not the same as checking facts.","LLM хороши в составлении черновиков, резюмировании, переводе и объяснениях. Но они могут уверенно говорить неправду — это называют галлюцинацией, потому что создание правдоподобного текста — не то же самое, что проверка фактов.","LLMlar qoralama yozish, xulosa qilish, tarjima va tushuntirishda kuchli. Biroq ular ishonch bilan xato gapirishi ham mumkin — buni gallyusinatsiya deyiladi, chunki ishonarli matn yaratish faktlarni tekshirish bilan bir xil emas."),
 Cc("Smart habit: Treat an AI answer as a strong first draft. For anything important, check a reliable source.","Полезная привычка: Относитесь к ответу ИИ как к сильному черновику. Всё важное проверяйте по надёжному источнику.","Foydali odat: Sun’iy intellekt javobini yaxshi qoralama deb biling. Muhim narsalarni ishonchli manbadan tekshiring.")],
 q:[Q(["What is a token?","Что такое токен?","Token nima?"],[["A small chunk of text","Небольшой фрагмент текста","Matnning kichik bo‘lagi"],["A password","Пароль","Parol"],["A type of computer chip","Тип компьютерного чипа","Kompyuter chipining turi"],["A human reviewer","Рецензент-человек","Inson tekshiruvchi"]],0),
 Q(["In what year was the transformer design introduced?","В каком году представили архитектуру трансформера?","Transformer arxitekturasi qaysi yilda taqdim etilgan?"],["1997","2005","2017","2023"],2),
 Q(["What is “hallucination” in AI?","Что такое «галлюцинация» у ИИ?","SIda “gallyusinatsiya” nima?"],[["Confident but wrong output","Уверенный, но неверный ответ","Ishonchli, ammo noto‘g‘ri javob"],["A computer virus","Компьютерный вирус","Kompyuter virusi"],["A slow response","Медленный ответ","Sekin javob"],["A kind of encryption","Вид шифрования","Shifrlash turi"]],0)]},

{slug:'black-holes-explained',cat:'astronomy',cats:['astronomy','physics'],ill:'galaxy',
 t:["Black Holes, Explained Without the Myths","Чёрные дыры без мифов","Qora tuynuklar: afsonalarsiz tushuntirish"],
 d:["Not cosmic vacuum cleaners, but places where gravity beats everything, even light.","Не космические пылесосы, а места, где гравитация побеждает всё, даже свет.","Koinot changyutgichi emas, balki tortishish hamma narsadan, hatto yorug‘likdan ham kuchli bo‘lgan joylar."],
 more:[{t:["NASA: Black holes","NASA: Чёрные дыры","NASA: Qora tuynuklar"],u:'https://science.nasa.gov/universe/black-holes/'}],
 b:[H("A place where gravity wins","Место, где побеждает гравитация","Tortishish g‘alaba qozonadigan joy"),
 Pp("A black hole is a region where gravity is so strong that nothing, not even light, can escape once it crosses a boundary called the event horizon. It is a huge mass squeezed into a tiny volume.","Чёрная дыра — область, где гравитация настолько сильна, что ничто, даже свет, не может вырваться, пересекая границу, называемую горизонтом событий. Это огромная масса, сжатая в крошечный объём.","Qora tuynuk — tortishish shu qadar kuchli bo‘lgan hududki, voqealar ufqi deb ataladigan chegarani kesib o‘tgan har qanday narsa, hatto yorug‘lik ham, undan qutula olmaydi. Bu juda kichik hajmga siqilgan ulkan massa."),
 H("How they form","Как они возникают","Ular qanday paydo bo‘ladi"),
 Pp("Most stellar black holes form when a very massive star runs out of fuel and its core collapses. Supermassive black holes sit at the centers of most big galaxies; the one in the Milky Way, Sagittarius A*, has about four million times the Sun’s mass.","Большинство чёрных дыр звёздной массы рождаются, когда очень массивная звезда исчерпывает топливо и её ядро коллапсирует. Сверхмассивные чёрные дыры находятся в центрах большинства крупных галактик; та, что в Млечном Пути, — Стрелец A*, — примерно в четыре миллиона раз массивнее Солнца.","Yulduz massali qora tuynuklarning ko‘pchiligi juda katta yulduzning yoqilg‘isi tugab, yadrosi qulaganda hosil bo‘ladi. O‘ta massiv qora tuynuklar ko‘pchilik katta galaktikalar markazida joylashgan; Somon yo‘lidagisi — Sagittarius A* — Quyoshdan taxminan to‘rt million marta og‘ir."),
 H("We have photographed them","Мы их сфотографировали","Biz ularni suratga oldik"),
 Pp("In 2019 the Event Horizon Telescope released the first image of a black hole’s shadow, in galaxy M87. In 2022 it followed with Sagittarius A*.","В 2019 году телескоп Event Horizon опубликовал первое изображение тени чёрной дыры в галактике M87. В 2022 году появился снимок Стрельца A*.","2019-yilda Event Horizon teleskopi M87 galaktikasidagi qora tuynuk soyasining birinchi tasvirini e’lon qildi. 2022-yilda Sagittarius A* tasviri ham chop etildi."),
 H("Common myth","Распространённый миф","Keng tarqalgan afsona"),
 Pp("Black holes do not roam space sucking up everything. If the Sun were replaced by a black hole of the same mass, Earth would keep orbiting as before, only in the dark.","Чёрные дыры не бродят по космосу, засасывая всё подряд. Если заменить Солнце чёрной дырой той же массы, Земля продолжила бы вращаться по прежней орбите — только в темноте.","Qora tuynuklar koinotda kezib hamma narsani yutmaydi. Agar Quyosh o‘rniga shunday massali qora tuynuk qo‘yilsa, Yer avvalgidek aylanardi, faqat qorong‘ida."),
 Cc("Mind-bending fact: Time runs slower near a black hole than far from it. A much weaker version of this effect is something GPS satellites correct for.","Удивительный факт: Вблизи чёрной дыры время идёт медленнее, чем вдали. Гораздо более слабый вариант этого эффекта учитывают спутники GPS.","Ajoyib fakt: Qora tuynuk yaqinida vaqt uzoqdagiga qaraganda sekinroq o‘tadi. Bu ta’sirning ancha kuchsiz ko‘rinishini GPS yo‘ldoshlari hisobga oladi.")],
 q:[Q(["What is the boundary of a black hole called?","Как называется граница чёрной дыры?","Qora tuynuk chegarasi nima deb ataladi?"],[["Event horizon","Горизонт событий","Voqealar ufqi"],["Corona","Корона","Toj"],["Singularity belt","Пояс сингулярности","Sinqulyarlik kamari"],["Photon wall","Фотонная стена","Foton devori"]],0),
 Q(["Which black hole is at the center of the Milky Way?","Какая чёрная дыра находится в центре Млечного Пути?","Somon yo‘li markazida qaysi qora tuynuk joylashgan?"],["M87*","Sagittarius A*","Cygnus X-1","Betelgeuse"],1),
 Q(["If the Sun became a black hole of the same mass, Earth would…","Если бы Солнце стало чёрной дырой той же массы, Земля…","Agar Quyosh shu massali qora tuynukka aylansa, Yer…"],[["keep orbiting","продолжила бы вращаться по орбите","aylanishda davom etardi"],["be sucked in at once","мгновенно была бы засосана","darhol yutilardi"],["fly away instantly","мгновенно улетела бы","bir zumda uchib ketardi"],["stop spinning","перестала бы вращаться","aylanishdan to‘xtardi"]],0)]},

{slug:'wood-wide-web',cat:'biology',cats:['biology','environment'],ill:'roots',
 t:["The Wood Wide Web: What Do We Really Know?","«Древесный интернет»: что мы знаем на самом деле?","“Daraxtlar interneti”: biz aslida nimani bilamiz?"],
 d:["Do trees really talk through underground fungal networks? The real story is more interesting than the headlines.","Правда ли, что деревья «общаются» через подземные грибные сети? Реальная история интереснее заголовков.","Daraxtlar yer ostidagi zamburug‘ tarmoqlari orqali “gaplashadi”mi? Haqiqiy hikoya sarlavhalardan qiziqroq."],
 b:[H("A partnership underground","Подземное партнёрство","Yer ostidagi hamkorlik"),
 Pp("Most land plants partner with fungi. Fungal threads called hyphae reach far into the soil, absorbing water and nutrients such as phosphorus and nitrogen. In return, the plant gives sugars made by photosynthesis. These partnerships are called mycorrhizae.","Большинство наземных растений сотрудничают с грибами. Грибные нити — гифы — проникают далеко в почву, поглощая воду и питательные вещества, например фосфор и азот. Взамен растение отдаёт сахара, созданные при фотосинтезе. Такое партнёрство называют микоризой.","Quruqlikdagi o‘simliklarning ko‘pchiligi zamburug‘lar bilan hamkorlik qiladi. Gifa deb ataladigan zamburug‘ iplari tuproqning chuqurigacha yetib, suv va fosfor, azot kabi oziq moddalarni singdiradi. Evaziga o‘simlik fotosintezda hosil bo‘lgan shakarni beradi. Bunday hamkorlik mikoriza deyiladi."),
 H("What is still debated","Что остаётся предметом споров","Nimalar hali munozarali"),
 Pp("That plants and fungi trade resources is well established. Whether older “mother trees” deliberately feed younger ones is much less clear. A 2023 review argued that some popular claims run ahead of the evidence and called for more careful field experiments.","То, что растения и грибы обмениваются ресурсами, хорошо установлено. Но кормят ли старые «деревья-матери» намеренно молодые — гораздо менее ясно. Обзор 2023 года указал, что некоторые популярные утверждения опережают доказательства, и призвал к более тщательным полевым экспериментам.","O‘simlik va zamburug‘lar resurs almashishi yaxshi isbotlangan. Biroq keksa “ona daraxtlar” yoshlarini ataylab oziqlantiradimi — bu ancha noaniq. 2023-yildagi sharhda ba’zi mashhur da’volar dalillardan oldinda ekani aytilib, ehtiyotkorroq dala tajribalari talab qilindi."),
 Cc("Science in action: A hypothesis can be exciting, partly supported and still under test. Good science says how much we know and how much we do not.","Наука в действии: Гипотеза может быть захватывающей, частично подтверждённой и всё ещё проверяемой. Хорошая наука говорит, сколько мы знаем и сколько — нет.","Ilm amalda: Gipoteza qiziqarli, qisman tasdiqlangan va hali sinovda bo‘lishi mumkin. Yaxshi ilm qancha bilishimiz va qanchasini bilmasligimizni aytadi.")],
 q:[Q(["What are mycorrhizae?","Что такое микориза?","Mikoriza nima?"],[["Partnerships between fungi and plant roots","Партнёрство грибов и корней растений","Zamburug‘lar va o‘simlik ildizlari hamkorligi"],["A type of tree disease","Болезнь деревьев","Daraxt kasalligi"],["Underground rivers","Подземные реки","Yer osti daryolari"],["Insect colonies","Колонии насекомых","Hasharot koloniyalari"]],0),
 Q(["What does the plant give the fungus?","Что растение отдаёт грибу?","O‘simlik zamburug‘ga nima beradi?"],[["Sugars","Сахара","Shakar"],["Water only","Только воду","Faqat suv"],["Sunlight","Солнечный свет","Quyosh nuri"],["Oxygen","Кислород","Kislorod"]],0),
 Q(["Which claim is still debated?","Какое утверждение остаётся спорным?","Qaysi da’vo hali munozarali?"],[["Mother trees deliberately help their young","«Деревья-матери» намеренно помогают молодым","“Ona daraxtlar” yoshlariga ataylab yordam beradi"],["Fungi absorb nutrients","Грибы поглощают питательные вещества","Zamburug‘lar oziq moddalarni singdiradi"],["Plants make sugars","Растения создают сахара","O‘simliklar shakar hosil qiladi"],["Roots reach into soil","Корни уходят в почву","Ildizlar tuproqqa kiradi"]],0)]},

{slug:'how-gps-works',cat:'technology',cats:['technology','engineering','physics'],ill:'solar',
 t:["How GPS Knows Where You Are","Как GPS узнаёт, где вы находитесь","GPS siz qayerdaligingizni qanday biladi"],
 d:["Your phone never sends a signal to a satellite. It simply listens, and does some remarkable math.","Ваш телефон не отправляет сигнал спутнику. Он просто слушает и выполняет удивительные вычисления.","Telefoningiz yo‘ldoshga signal yubormaydi. U shunchaki tinglaydi va ajoyib hisob-kitob qiladi."],
 more:[{t:"GPS.gov",u:'https://www.gps.gov'}],
 b:[H("Satellites that broadcast time","Спутники, передающие время","Vaqtni uzatuvchi yo‘ldoshlar"),
 Pp("GPS is a constellation of around thirty satellites orbiting about 20,200 km above Earth. Each carries atomic clocks and broadcasts its position and the exact time the signal was sent.","GPS — это группировка примерно из тридцати спутников на высоте около 20 200 км над Землёй. На каждом стоят атомные часы, и он передаёт своё положение и точное время отправки сигнала.","GPS — Yer ustidan taxminan 20 200 km balandlikda aylanuvchi o‘ttizga yaqin yo‘ldoshdan iborat tizim. Har birida atom soatlari bor va u o‘z joylashuvi hamda signal yuborilgan aniq vaqtni uzatadi."),
 H("Distance from time","Расстояние из времени","Vaqtdan masofa"),
 Pp("Radio waves travel at the speed of light, so by measuring how long a signal took to arrive, your phone calculates its distance to that satellite. Several such distances intersect at one point. A fourth satellite lets the phone correct its own imprecise clock.","Радиоволны распространяются со скоростью света, поэтому, измерив время прохождения сигнала, телефон вычисляет расстояние до спутника. Несколько таких расстояний пересекаются в одной точке. Четвёртый спутник позволяет телефону исправить ошибку своих неточных часов.","Radioto‘lqinlar yorug‘lik tezligida tarqaladi, shuning uchun signal qancha vaqtda yetib kelganini o‘lchab, telefon yo‘ldoshgacha masofani hisoblaydi. Bir nechta shunday masofa bitta nuqtada kesishadi. To‘rtinchi yo‘ldosh telefonga o‘zining noaniq soatini to‘g‘rilash imkonini beradi."),
 H("Einstein inside your phone","Эйнштейн в вашем телефоне","Telefoningiz ichidagi Eynshteyn"),
 Pp("Relativity matters. Satellite clocks tick slower because of their speed but faster because they sit higher in Earth’s gravity; the net effect is about 38 microseconds gained per day. Uncorrected, errors would grow by roughly ten kilometers each day.","Теория относительности важна. Часы спутников идут медленнее из-за скорости, но быстрее из-за более высокого положения в гравитации Земли; в итоге они уходят вперёд примерно на 38 микросекунд в сутки. Без поправки ошибка росла бы примерно на десять километров в день.","Nisbiylik nazariyasi muhim. Yo‘ldosh soatlari tezligi tufayli sekinroq, lekin Yer tortishishida balandroq joylashgani uchun tezroq yuradi; natijada kuniga taxminan 38 mikrosekund oldinga ketadi. To‘g‘rilanmasa, xato har kuni taxminan o‘n kilometrga o‘sardi."),
 Cc("Not just GPS: Europe’s Galileo, Russia’s GLONASS and China’s BeiDou do similar jobs, and many phones use several systems at once.","Не только GPS: Европейская Galileo, российская ГЛОНАСС и китайская BeiDou выполняют похожие задачи, а многие телефоны используют сразу несколько систем.","Faqat GPS emas: Yevropaning Galileo, Rossiyaning GLONASS va Xitoyning BeiDou tizimlari ham shunday ishlaydi, ko‘p telefonlar bir nechta tizimdan birdaniga foydalanadi.")],
 q:[Q(["Roughly how many satellites are in the GPS constellation?","Сколько примерно спутников в системе GPS?","GPS tizimida taxminan nechta yo‘ldosh bor?"],["~3","~30","~300","~3,000"],1),
 Q(["Why does a phone need a fourth satellite?","Зачем телефону четвёртый спутник?","Telefonga nega to‘rtinchi yo‘ldosh kerak?"],[["To correct its own clock error","Чтобы исправить ошибку своих часов","O‘z soatining xatosini to‘g‘rilash uchun"],["To get more speed","Чтобы быть быстрее","Tezroq bo‘lish uchun"],["To charge the battery","Чтобы зарядить батарею","Batareyani zaryadlash uchun"],["To talk to other phones","Чтобы связаться с другими телефонами","Boshqa telefonlar bilan gaplashish uchun"]],0),
 Q(["Whose theory explains why satellite clocks need correction?","Чья теория объясняет необходимость поправки часов спутников?","Yo‘ldosh soatlarini to‘g‘rilash zarurligini kimning nazariyasi tushuntiradi?"],[["Einstein","Эйнштейн","Eynshteyn"],["Newton","Ньютон","Nyuton"],["Darwin","Дарвин","Darvin"],["Pascal","Паскаль","Paskal"]],0)]},

{slug:'why-sky-blue',cat:'physics',cats:['physics','environment'],ill:'wave',
 t:["Why Is the Sky Blue?","Почему небо голубое?","Osmon nega moviy?"],
 d:["Sunlight looks white, yet the sky is blue and sunsets are red. The answer hides in how light bounces off air.","Солнечный свет кажется белым, но небо голубое, а закаты красные. Ответ скрыт в том, как свет рассеивается воздухом.","Quyosh nuri oq ko‘rinadi, ammo osmon moviy, botish qizil. Javob yorug‘likning havodan sochilishida yashiringan."],
 b:[H("Sunlight is a blend of colors","Солнечный свет — смесь цветов","Quyosh nuri ranglar aralashmasi"),
 Pp("Sunlight is a mixture of every color of the rainbow. Each color is a different wavelength: red has long waves, blue has short ones.","Солнечный свет — смесь всех цветов радуги. Каждый цвет — это своя длина волны: у красного она длинная, у синего — короткая.","Quyosh nuri kamalakning barcha ranglari aralashmasi. Har bir rang alohida to‘lqin uzunligi: qizilniki uzun, ko‘kniki qisqa."),
 H("Air scatters short waves more","Воздух сильнее рассеивает короткие волны","Havo qisqa to‘lqinlarni ko‘proq sochadi"),
 Pp("Air molecules are far smaller than the wavelength of visible light, and for such particles scattering grows sharply as wavelength shrinks. This is Rayleigh scattering, worked out by Lord Rayleigh in the 1870s. Blue light scatters several times more than red, so scattered blue light reaches your eyes from every direction.","Молекулы воздуха намного меньше длины волны видимого света, а для таких частиц рассеяние резко растёт при уменьшении длины волны. Это рассеяние Рэлея, описанное лордом Рэлеем в 1870-х годах. Синий свет рассеивается в несколько раз сильнее красного, поэтому рассеянный синий приходит в глаза со всех сторон.","Havo molekulalari ko‘rinadigan yorug‘lik to‘lqin uzunligidan ancha kichik, bunday zarralar uchun sochilish to‘lqin uzunligi kamayganda keskin kuchayadi. Bu 1870-yillarda Lord Reley tushuntirgan Reley sochilishi. Ko‘k nur qizildan bir necha baravar ko‘p sochiladi, shuning uchun sochilgan ko‘k nur ko‘zimizga har tomondan keladi."),
 H("And sunsets?","А закаты?","Botish-chi?"),
 Pp("When the Sun is low, its light crosses much more air. Most blue is scattered away from the direct beam, leaving orange and red.","Когда Солнце низко, его свет проходит через гораздо больше воздуха. Большая часть синего рассеивается из прямого луча, остаются оранжевый и красный.","Quyosh past bo‘lganda, nuri ancha ko‘p havo qatlamidan o‘tadi. Ko‘k rangning ko‘pi to‘g‘ri nurdan sochilib ketadi, to‘q sariq va qizil qoladi."),
 Cc("Try it at home: Stir a few drops of milk into a glass of water and shine a flashlight through it. The beam looks faintly blue from the side and warmer at the far end.","Попробуйте дома: Добавьте несколько капель молока в стакан воды и посветите фонариком. Сбоку луч кажется слегка голубым, а на выходе — теплее.","Uyda sinab ko‘ring: Bir stakan suvga bir necha tomchi sut qo‘shib, chiroq nurini tutib ko‘ring. Nur yon tomondan sal ko‘kimtir, narigi uchida esa iliqroq ko‘rinadi.")],
 q:[Q(["What causes the sky’s blue color?","Что делает небо голубым?","Osmonning moviy rangiga nima sabab?"],[["Scattering of light by air molecules","Рассеяние света молекулами воздуха","Yorug‘likning havo molekulalarida sochilishi"],["Reflection from the ocean","Отражение от океана","Okeandan qaytish"],["Dust from space","Космическая пыль","Koinot changi"],["The Moon’s glow","Свет Луны","Oy yog‘dusi"]],0),
 Q(["Which color scatters more strongly?","Какой цвет рассеивается сильнее?","Qaysi rang kuchliroq sochiladi?"],[["Blue","Синий","Ko‘k"],["Red","Красный","Qizil"],["Orange","Оранжевый","To‘q sariq"],["Yellow","Жёлтый","Sariq"]],0),
 Q(["Who worked out the scattering effect in the 1870s?","Кто описал этот эффект рассеяния в 1870-х?","1870-yillarda bu sochilish effektini kim tushuntirgan?"],[["Lord Rayleigh","Лорд Рэлей","Lord Reley"],["Galileo","Галилей","Galiley"],["Marie Curie","Мария Кюри","Mari Kyuri"],["Edison","Эдисон","Edison"]],0)]},

{slug:'how-memories-form',cat:'psychology',cats:['psychology','biology'],ill:'neuron',
 t:["How Your Brain Builds a Memory","Как мозг создаёт воспоминание","Miyangiz xotirani qanday yaratadi"],
 d:["Every memory is a physical change in your brain. Here is how an experience becomes something you can recall years later.","Каждое воспоминание — физическое изменение в мозге. Вот как переживание превращается в то, что можно вспомнить спустя годы.","Har bir xotira miyadagi jismoniy o‘zgarishdir. Tajriba yillar o‘tib eslash mumkin bo‘lgan narsaga qanday aylanishini ko‘rib chiqamiz."],
 b:[H("Encoding and consolidation","Кодирование и консолидация","Kodlash va mustahkamlanish"),
 Pp("A memory begins with attention. Fresh memories are fragile and are stabilized over hours, days and years in a process called consolidation. The hippocampus, a seahorse-shaped structure deep in the brain, helps bind the pieces of an experience together.","Воспоминание начинается с внимания. Свежие воспоминания хрупки и закрепляются часами, днями и годами в процессе консолидации. Гиппокамп — структура в форме морского конька в глубине мозга — помогает связать части переживания воедино.","Xotira diqqatdan boshlanadi. Yangi xotiralar mo‘rt bo‘lib, soatlar, kunlar va yillar davomida mustahkamlanish jarayonida barqarorlashadi. Miyaning chuqurligidagi dengiz oti shaklidagi tuzilma — gippokamp — tajriba bo‘laklarini bir-biriga bog‘lashga yordam beradi."),
 Pp("Sleep helps. During sleep the brain replays patterns of activity, and people who sleep after learning tend to remember more.","Сон помогает. Во сне мозг воспроизводит паттерны активности, и люди, спавшие после обучения, обычно запоминают больше.","Uyqu yordam beradi. Uyquda miya faollik namunalarini qayta takrorlaydi va o‘rganganidan keyin uxlagan odamlar ko‘proq eslab qoladi."),
 H("Retrieval and forgetting","Извлечение и забывание","Eslash va unutish"),
 Pp("Remembering is not playing back a recording; each time, your brain partly rebuilds the memory, which is why memories can shift. In the 1880s Hermann Ebbinghaus showed that most forgetting happens early and then slows down. Forgetting is normal.","Вспоминание — это не воспроизведение записи; каждый раз мозг частично перестраивает воспоминание, поэтому оно может меняться. В 1880-х Герман Эббингауз показал, что большая часть забывания происходит рано, затем замедляется. Забывать — нормально.","Eslash yozuvni qayta ijro etish emas; har safar miya xotirani qisman qayta quradi, shuning uchun xotiralar o‘zgarishi mumkin. 1880-yillarda Hermann Ebbingauz unutishning katta qismi erta sodir bo‘lib, keyin sekinlashishini ko‘rsatdi. Unutish — oddiy hol."),
 Cc("Study smarter: Test yourself instead of rereading, and space your practice over days. Both are among the best-supported learning techniques.","Учитесь умнее: Проверяйте себя вместо перечитывания и распределяйте повторения на несколько дней. Оба приёма хорошо подтверждены исследованиями.","Aqlliroq o‘qing: Qayta o‘qish o‘rniga o‘zingizni sinang va mashqlarni bir necha kunga yoying. Ikkalasi ham eng yaxshi isbotlangan o‘qish usullaridandir.")],
 q:[Q(["Which brain structure helps bind an experience together?","Какая структура мозга помогает связать переживание воедино?","Qaysi miya tuzilmasi tajribani bir butun qilishga yordam beradi?"],[["Hippocampus","Гиппокамп","Gippokamp"],["Cerebellum","Мозжечок","Miyacha"],["Spinal cord","Спинной мозг","Orqa miya"],["Optic nerve","Зрительный нерв","Ko‘ruv nervi"]],0),
 Q(["What does sleep do for memory?","Что сон делает для памяти?","Uyqu xotira uchun nima qiladi?"],[["Helps consolidate it","Помогает закрепить","Mustahkamlashga yordam beradi"],["Erases it all","Стирает всё","Hammasini o‘chiradi"],["Has no effect","Не влияет","Ta’sir qilmaydi"],["Makes it slower","Замедляет","Sekinlashtiradi"]],0),
 Q(["Which technique is well supported for learning?","Какой приём хорошо подтверждён для обучения?","O‘rganish uchun qaysi usul yaxshi isbotlangan?"],[["Testing yourself and spacing practice","Самопроверка и распределённое повторение","O‘zni sinash va mashqlarni yoyish"],["Cramming overnight","Зубрёжка за ночь","Bir kechada yodlash"],["Highlighting only","Только выделение текста","Faqat ajratib chizish"],["Reading once","Однократное чтение","Bir marta o‘qish"]],0)]},

{slug:'prime-numbers',cat:'mathematics',cats:['mathematics','technology'],ill:'spiral',
 t:["Prime Numbers: The Atoms of Mathematics","Простые числа: атомы математики","Tub sonlar: matematikaning atomlari"],
 d:["Simple to define, impossible to predict, and they quietly protect your online banking.","Просто определить, невозможно предсказать — и они тихо защищают ваш онлайн-банк.","Ta’riflash oson, bashorat qilish qiyin — va ular onlayn bankingizni jimgina himoya qiladi."],
 more:[{t:"Great Internet Mersenne Prime Search",u:'https://www.mersenne.org'}],
 b:[H("The building blocks","Строительные блоки","Qurilish bloklari"),
 Pp("A prime number is a whole number greater than 1 whose only divisors are 1 and itself: 2, 3, 5, 7, 11… Every other whole number can be built by multiplying primes, in only one way. That is why mathematicians treat primes like atoms.","Простое число — это целое число больше 1, делящееся только на 1 и на само себя: 2, 3, 5, 7, 11… Любое другое целое число можно составить умножением простых, причём единственным способом. Поэтому математики считают простые числа атомами.","Tub son — 1 dan katta, faqat 1 ga va o‘ziga bo‘linadigan butun son: 2, 3, 5, 7, 11… Boshqa har qanday butun sonni tub sonlarni ko‘paytirib, faqat bitta usulda hosil qilish mumkin. Shuning uchun matematiklar tub sonlarni atomlarga o‘xshatadi."),
 H("No biggest prime","Нет наибольшего простого","Eng katta tub son yo‘q"),
 Pp("Around 300 BC, Euclid proved the primes never run out. Multiply any finite list of primes and add 1: the result is either a new prime or has a prime factor missing from the list. So no list is ever complete.","Около 300 г. до н. э. Евклид доказал, что простые числа не кончаются. Перемножьте любой конечный список простых и прибавьте 1: результат либо новое простое, либо имеет простой делитель, которого нет в списке. Значит, полного списка не бывает.","Taxminan eramizdan avvalgi 300-yilda Yevklid tub sonlar tugamasligini isbotladi. Tub sonlarning istalgan chekli ro‘yxatini ko‘paytirib, 1 qo‘shing: natija yoki yangi tub son, yoki ro‘yxatda yo‘q tub ko‘paytuvchiga ega. Demak, to‘liq ro‘yxat bo‘lmaydi."),
 H("Why primes protect your data","Почему простые числа защищают данные","Tub sonlar ma’lumotlaringizni nega himoya qiladi"),
 Pp("Multiplying two huge primes is easy; finding them from the product is extremely hard. Public-key encryption such as RSA relies on that imbalance to keep banking and messages private. Record primes now have tens of millions of digits, found by volunteers in the GIMPS project.","Перемножить два огромных простых числа легко; найти их по произведению — крайне трудно. Шифрование с открытым ключом, например RSA, опирается на эту асимметрию, защищая банковские операции и переписку. Рекордные простые сегодня содержат десятки миллионов цифр; их находят волонтёры проекта GIMPS.","Ikkita ulkan tub sonni ko‘paytirish oson; ko‘paytmadan ularni topish esa juda qiyin. RSA kabi ochiq kalitli shifrlash bank amallari va xabarlarni himoya qilishda shu nomutanosiblikka tayanadi. Rekord tub sonlar hozir o‘n millionlab raqamdan iborat, ularni GIMPS loyihasi ko‘ngillilari topadi."),
 Cc("Open question: Nobody has proved whether there are infinitely many twin primes, pairs like 11 and 13.","Открытый вопрос: Никто не доказал, бесконечно ли много простых-близнецов — пар вроде 11 и 13.","Ochiq savol: 11 va 13 kabi egizak tub sonlar cheksiz ko‘pligini hali hech kim isbotlamagan.")],
 q:[Q(["Which number is prime?","Какое число простое?","Qaysi son tub?"],["9","15","17","21"],2),
 Q(["Who proved there are infinitely many primes?","Кто доказал, что простых чисел бесконечно много?","Tub sonlar cheksiz ekanini kim isbotlagan?"],[["Euclid","Евклид","Yevklid"],["Pythagoras","Пифагор","Pifagor"],["Newton","Ньютон","Nyuton"],["Gauss","Гаусс","Gauss"]],0),
 Q(["Which system relies on the difficulty of factoring large numbers?","Какая система опирается на сложность разложения больших чисел?","Qaysi tizim katta sonlarni ko‘paytuvchilarga ajratish qiyinligiga tayanadi?"],["RSA","GPS","HTML","USB"],0)]},

{slug:'how-bridges-stand',cat:'engineering',cats:['engineering','physics'],ill:'bridge',
 t:["How Bridges Stay Up","Как держатся мосты","Ko‘priklar qanday turadi"],
 d:["Every bridge is a negotiation between two forces: squeezing and stretching.","Каждый мост — это договорённость между двумя силами: сжатием и растяжением.","Har bir ko‘prik ikki kuch — siqilish va cho‘zilish o‘rtasidagi kelishuvdir."],
 b:[H("Two forces to manage","Две силы, которыми нужно управлять","Boshqarish kerak bo‘lgan ikki kuch"),
 Pp("Every part of a bridge is either squeezed (compression) or stretched (tension). Stone and concrete are strong in compression; steel cables are strong in tension. Good design puts each material where it works best.","Каждая часть моста либо сжимается (сжатие), либо растягивается (растяжение). Камень и бетон прочны на сжатие; стальные тросы — на растяжение. Хороший проект ставит каждый материал туда, где он работает лучше всего.","Ko‘prikning har bir qismi yoki siqiladi (siqilish), yoki cho‘ziladi (cho‘zilish). Tosh va beton siqilishga, po‘lat tros esa cho‘zilishga chidamli. Yaxshi loyiha har bir materialni eng yaxshi ishlaydigan joyga qo‘yadi."),
 H("Four classic designs","Четыре классических конструкции","To‘rtta klassik loyiha"),
 Ll([["Beam bridges rest a flat span on supports at each end.","Балочные мосты опираются плоским пролётом на опоры по краям.","To‘sinli ko‘priklar tekis oraliqni ikki chetdagi tayanchlarga tayantiradi."],["Arch bridges turn the deck’s weight into compression flowing into the supports.","Арочные мосты превращают вес полотна в сжатие, передающееся на опоры.","Archali ko‘priklar yo‘l og‘irligini tayanchlarga o‘tuvchi siqilishga aylantiradi."],["Suspension bridges hang the deck from cables in tension, allowing very long spans.","Висячие мосты подвешивают полотно на тросах, работающих на растяжение, что позволяет перекрывать очень большие пролёты.","Osma ko‘priklar yo‘lni cho‘zilishda ishlovchi troslarga osadi, bu juda uzun oraliqlarga imkon beradi."],["Cable-stayed bridges run cables straight from towers to the deck.","Вантовые мосты имеют тросы, идущие прямо от пилонов к полотну.","Vantali ko‘priklarda tros minoralardan to‘g‘ridan-to‘g‘ri yo‘lga tortiladi."]]),
 H("Wind is a designer too","Ветер — тоже проектировщик","Shamol ham loyihachi"),
 Pp("In 1940 the Tacoma Narrows Bridge twisted itself apart in a moderate wind, due to aeroelastic flutter. Since then, large bridges are tested in wind tunnels before construction.","В 1940 году мост Такома-Нарроуз разрушился от умеренного ветра из-за аэроупругого флаттера. С тех пор большие мосты испытывают в аэродинамических трубах до строительства.","1940-yilda Takoma-Narrouz ko‘prigi o‘rtacha shamolda aeroelastik flatter tufayli o‘z-o‘zidan buralib qulab tushdi. O‘shandan beri katta ko‘priklar qurilishdan oldin aerodinamik quvurlarda sinab ko‘riladi."),
 Cc("Look closely: Find the triangles, arches or cables on the next bridge you cross and ask which parts are squeezed and which are stretched.","Присмотритесь: На следующем мосту найдите треугольники, арки или тросы и подумайте, какие части сжимаются, а какие растягиваются.","Diqqat bilan qarang: Keyingi ko‘prikda uchburchak, arka yoki troslarni toping va qaysi qismlar siqilayotgani, qaysilari cho‘zilayotganini o‘ylang.")],
 q:[Q(["Which material is strong when squeezed?","Какой материал прочен на сжатие?","Qaysi material siqilishga chidamli?"],[["Concrete","Бетон","Beton"],["Rubber band","Резинка","Rezina"],["Silk thread","Шёлковая нить","Ipak ip"],["Paper","Бумага","Qog‘oz"]],0),
 Q(["Which bridge type hangs the deck from cables over towers?","Какой тип моста подвешивает полотно к тросам над пилонами?","Qaysi ko‘prik yo‘lni minoralar ustidagi troslarga osadi?"],[["Suspension","Висячий","Osma"],["Beam","Балочный","To‘sinli"],["Arch","Арочный","Archali"],["Truss","Ферменный","Fermali"]],0),
 Q(["What destroyed the Tacoma Narrows Bridge in 1940?","Что разрушило мост Такома-Нарроуз в 1940 году?","1940-yilda Takoma-Narrouz ko‘prigini nima vayron qildi?"],[["Wind-driven flutter","Ветровой флаттер","Shamol keltirgan flatter"],["An earthquake","Землетрясение","Zilzila"],["A flood","Наводнение","Toshqin"],["A collision","Столкновение","To‘qnashuv"]],0)]},

{slug:'chemistry-of-fire',cat:'chemistry',cats:['chemistry','physics'],ill:'molecule',
 t:["The Chemistry of Fire","Химия огня","Olov kimyosi"],
 d:["Fire is not a substance. It is a chain reaction you can see.","Огонь — не вещество. Это цепная реакция, которую можно увидеть.","Olov modda emas. Bu ko‘z bilan ko‘rish mumkin bo‘lgan zanjir reaksiyasi."],
 b:[H("A reaction you can see","Реакция, которую видно","Ko‘rinadigan reaksiya"),
 Pp("Fire is combustion: a fast reaction between fuel and oxygen that releases heat and light. When wood or gas burns, carbon and hydrogen combine with oxygen to form mainly carbon dioxide and water vapor.","Огонь — это горение: быстрая реакция топлива с кислородом с выделением тепла и света. Когда горят дерево или газ, углерод и водород соединяются с кислородом, образуя в основном углекислый газ и водяной пар.","Olov — yonish: yoqilg‘i va kislorod o‘rtasidagi issiqlik va yorug‘lik chiqaradigan tez reaksiya. Yog‘och yoki gaz yonganda uglerod va vodorod kislorod bilan birikib, asosan karbonat angidrid va suv bug‘ini hosil qiladi."),
 H("The fire triangle","Треугольник огня","Olov uchburchagi"),
 Pp("Fire needs fuel, oxygen and heat. Remove any one and it goes out: water removes heat, foam or carbon dioxide cuts off oxygen, and firebreaks remove fuel.","Огню нужны топливо, кислород и тепло. Уберите что-то одно — и он погаснет: вода отнимает тепло, пена или углекислый газ перекрывают кислород, а противопожарные полосы убирают топливо.","Olovga yoqilg‘i, kislorod va issiqlik kerak. Birini olib tashlasangiz, o‘chadi: suv issiqlikni olib ketadi, ko‘pik yoki karbonat angidrid kislorodni to‘sadi, yong‘in to‘siqlari yoqilg‘ini yo‘qotadi."),
 H("Why flames have colors","Почему у пламени цвета","Alanganing ranglari nega bor"),
 Pp("Yellow and orange come mostly from tiny soot particles heated until they glow. Blue flames, like on a gas stove, burn with plenty of oxygen and glow as excited molecules release light.","Жёлтый и оранжевый цвета в основном дают мельчайшие частицы сажи, раскалённые до свечения. Синее пламя, как на газовой плите, горит при избытке кислорода и светится, когда возбуждённые молекулы излучают свет.","Sariq va to‘q sariq rang asosan yonib turgan mayda qurum zarralaridan chiqadi. Gaz plitasidagi kabi ko‘k alanga kislorod mo‘l bo‘lganda yonadi va qo‘zg‘algan molekulalar yorug‘lik chiqarganda porlaydi."),
 Cc("Safety note: Never fight a grease fire with water. Cover the pan with a lid and turn off the heat.","Безопасность: Никогда не тушите горящее масло водой. Накройте сковороду крышкой и выключите огонь.","Xavfsizlik: Yog‘ yong‘inini hech qachon suv bilan o‘chirmang. Tovani qopqoq bilan yoping va olovni o‘chiring.")],
 q:[Q(["Which three things form the fire triangle?","Какие три элемента образуют треугольник огня?","Olov uchburchagini qaysi uch narsa tashkil qiladi?"],[["Fuel, oxygen, heat","Топливо, кислород, тепло","Yoqilg‘i, kislorod, issiqlik"],["Wood, water, air","Дерево, вода, воздух","Yog‘och, suv, havo"],["Smoke, ash, spark","Дым, зола, искра","Tutun, kul, uchqun"],["Gas, wind, stone","Газ, ветер, камень","Gaz, shamol, tosh"]],0),
 Q(["Yellow flames mostly come from…","Жёлтое пламя в основном возникает из-за…","Sariq alanga asosan…"],[["glowing soot particles","раскалённых частиц сажи","qizigan qurum zarralaridan"],["pure oxygen","чистого кислорода","sof kisloroddan"],["cold light","холодного света","sovuq yorug‘likdan"],["magnets","магнитов","magnitlardan"]],0),
 Q(["What do you do with a grease fire?","Что делать при загорании масла?","Yog‘ yonib ketsa nima qilinadi?"],[["Cover with a lid","Накрыть крышкой","Qopqoq bilan yopish"],["Throw water","Залить водой","Suv sepish"],["Blow on it","Дуть на него","Puflash"],["Add more oil","Добавить масла","Ko‘proq yog‘ qo‘shish"]],0)]},

{slug:'how-vaccines-work',cat:'medicine',cats:['medicine','biology'],ill:'cell',
 t:["How Vaccines Train Your Immune System","Как вакцины тренируют иммунитет","Vaksinalar immunitetni qanday mashq qildiradi"],
 d:["A vaccine is a safe rehearsal: your body practices fighting a germ without ever getting the disease.","Вакцина — безопасная репетиция: организм учится бороться с микробом, не заболев.","Vaksina — xavfsiz mashq: tanangiz kasallikka chalinmasdan mikrobga qarshi kurashishni o‘rganadi."],
 b:[H("A rehearsal for the immune system","Репетиция для иммунной системы","Immun tizimi uchun mashq"),
 Pp("A vaccine shows your immune system a harmless piece or weakened form of a germ, or instructions to make a piece of it. Your body responds by producing antibodies and memory cells that remember the invader.","Вакцина показывает иммунной системе безвредный фрагмент или ослабленную форму микроба либо инструкцию для производства такого фрагмента. Организм вырабатывает антитела и клетки памяти, запоминающие захватчика.","Vaksina immun tizimiga mikrobning zararsiz bo‘lagini yoki zaiflashtirilgan shaklini, yoxud shunday bo‘lakni yaratish ko‘rsatmasini ko‘rsatadi. Tana antitanalar va bosqinchini eslab qoladigan xotira hujayralarini hosil qiladi."),
 H("Why it works","Почему это работает","Nega bu ishlaydi"),
 Pp("If the real germ arrives later, memory cells recognize it quickly and the body responds faster and stronger. In 1796 Edward Jenner used cowpox material to protect against smallpox, and smallpox was declared eradicated in 1980.","Если настоящий микроб придёт позже, клетки памяти быстро его распознают, и организм отвечает быстрее и сильнее. В 1796 году Эдвард Дженнер применил материал коровьей оспы для защиты от натуральной оспы, а в 1980 году оспу объявили искоренённой.","Keyinchalik haqiqiy mikrob kelsa, xotira hujayralari uni tez taniydi va tana tezroq va kuchliroq javob beradi. 1796-yilda Edvard Jenner chechakdan himoya qilish uchun sigir chechagi materialidan foydalandi, 1980-yilda esa chechak yo‘q qilingani e’lon qilindi."),
 H("Protecting others","Защита других","Boshqalarni himoya qilish"),
 Pp("When enough people are immune, a disease struggles to spread, which protects babies and people who cannot be vaccinated. This is called herd immunity. Vaccines are tested in trials and monitored for safety after approval.","Когда иммунитет есть у достаточного числа людей, болезни трудно распространяться, и это защищает младенцев и тех, кому нельзя делать прививку. Это называется коллективным иммунитетом. Вакцины проверяют в испытаниях и наблюдают за безопасностью после одобрения.","Yetarlicha odam immunitetga ega bo‘lsa, kasallik tarqalishi qiyinlashadi, bu go‘daklar va emlanishi mumkin bo‘lmaganlarni himoya qiladi. Bunga jamoaviy immunitet deyiladi. Vaksinalar sinovlarda tekshiriladi va tasdiqlangandan keyin ham xavfsizligi kuzatiladi."),
 Cc("Remember: Health decisions are personal. Talk to a doctor or pharmacist about your situation.","Помните: Решения о здоровье — личные. Обсудите свою ситуацию с врачом или фармацевтом.","Esda tuting: Sog‘liq haqidagi qarorlar shaxsiydir. O‘z holatingiz haqida shifokor yoki farmatsevt bilan maslahatlashing.")],
 q:[Q(["What do memory cells do?","Что делают клетки памяти?","Xotira hujayralari nima qiladi?"],[["Remember the germ for a faster response","Запоминают микроб для быстрого ответа","Tezroq javob uchun mikrobni eslab qoladi"],["Digest food","Переваривают пищу","Ovqatni hazm qiladi"],["Carry oxygen","Переносят кислород","Kislorod tashiydi"],["Make bones","Создают кости","Suyak hosil qiladi"]],0),
 Q(["Who used cowpox in 1796 to protect against smallpox?","Кто в 1796 году применил коровью оспу против натуральной оспы?","1796-yilda chechakka qarshi sigir chechagini kim qo‘llagan?"],[["Edward Jenner","Эдвард Дженнер","Edvard Jenner"],["Louis Pasteur","Луи Пастер","Lui Paster"],["Alexander Fleming","Александр Флеминг","Aleksandr Fleming"],["Robert Koch","Роберт Кох","Robert Kox"]],0),
 Q(["What is herd immunity?","Что такое коллективный иммунитет?","Jamoaviy immunitet nima?"],[["Enough people are immune, so spread slows","Достаточно людей имеют иммунитет, распространение замедляется","Yetarli odam immun, tarqalish sekinlashadi"],["Immunity in animals only","Иммунитет только у животных","Faqat hayvonlardagi immunitet"],["A type of medicine","Вид лекарства","Dori turi"],["A lab machine","Лабораторный прибор","Laboratoriya jihozi"]],0)]},

{slug:'greenhouse-effect',cat:'environment',cats:['environment','physics'],ill:'earth',
 t:["The Greenhouse Effect and Climate Change","Парниковый эффект и изменение климата","Issiqxona effekti va iqlim o‘zgarishi"],
 d:["Without a natural greenhouse effect Earth would be frozen. The issue is that we are adding more.","Без природного парникового эффекта Земля была бы замёрзшей. Проблема в том, что мы добавляем его.","Tabiiy issiqxona effektisiz Yer muzlab qolgan bo‘lardi. Muammo shundaki, biz uni kuchaytiryapmiz."],
 b:[H("How the greenhouse effect works","Как работает парниковый эффект","Issiqxona effekti qanday ishlaydi"),
 Pp("Sunlight warms Earth, which sends heat back toward space as infrared radiation. Gases like carbon dioxide, methane and water vapor absorb some of that heat and re-emit it, keeping the planet about 33 °C warmer than it would otherwise be.","Солнечный свет нагревает Землю, а она излучает тепло в космос в виде инфракрасных лучей. Газы вроде углекислого, метана и водяного пара поглощают часть этого тепла и переизлучают его, делая планету примерно на 33 °C теплее, чем она была бы.","Quyosh nuri Yerni isitadi, Yer esa issiqlikni infraqizil nurlanish sifatida koinotga qaytaradi. Karbonat angidrid, metan va suv bug‘i kabi gazlar bu issiqlikning bir qismini yutib qayta chiqaradi va sayyorani aks holdagidan taxminan 33 °C iliqroq saqlaydi."),
 H("What changed","Что изменилось","Nima o‘zgardi"),
 Pp("Burning coal, oil and gas has raised atmospheric carbon dioxide from about 280 parts per million before industry to well over 400 today. Global average temperature has risen by more than 1 °C since the late 1800s, according to major climate agencies.","Сжигание угля, нефти и газа подняло содержание углекислого газа в атмосфере примерно с 280 частей на миллион до доиндустриальной эпохи до значений заметно выше 400 сегодня. По данным крупных климатических агентств, средняя глобальная температура выросла более чем на 1 °C с конца XIX века.","Ko‘mir, neft va gazni yoqish atmosferadagi karbonat angidridni sanoatgacha bo‘lgan taxminan 280 ppm dan hozirgi 400 dan ancha yuqori darajaga ko‘tardi. Yirik iqlim agentliklari ma’lumotiga ko‘ra, global o‘rtacha harorat 1800-yillar oxiridan beri 1 °C dan ko‘proq oshgan."),
 H("Weather vs climate","Погода и климат","Ob-havo va iqlim"),
 Pp("Weather is what happens today; climate is the pattern over decades. One cold day does not disprove warming, just as one warm day does not prove it. Cutting emissions, improving efficiency and protecting forests all help.","Погода — это то, что происходит сегодня; климат — закономерность за десятилетия. Один холодный день не опровергает потепление, как один тёплый не доказывает его. Помогают сокращение выбросов, повышение эффективности и защита лесов.","Ob-havo — bugun nima bo‘layotgani; iqlim — o‘nlab yillik qonuniyat. Bitta sovuq kun isishni inkor etmaydi, bitta issiq kun esa uni isbotlamaydi. Chiqindilarni kamaytirish, samaradorlikni oshirish va o‘rmonlarni asrash yordam beradi."),
 Cc("Do your part: Saving energy at home, walking or cycling, and wasting less food all reduce emissions.","Ваш вклад: Экономия энергии дома, ходьба или велосипед и меньше пищевых отходов снижают выбросы.","O‘z hissangiz: Uyda energiya tejash, piyoda yoki velosipedda yurish va ovqatni kamroq isrof qilish chiqindilarni kamaytiradi.")],
 q:[Q(["Which gas is a greenhouse gas?","Какой газ — парниковый?","Qaysi gaz issiqxona gazi?"],[["Carbon dioxide","Углекислый газ","Karbonat angidrid"],["Helium","Гелий","Geliy"],["Neon","Неон","Neon"],["Argon","Аргон","Argon"]],0),
 Q(["Without the natural greenhouse effect, Earth would be about how much colder?","Насколько холоднее была бы Земля без природного парникового эффекта?","Tabiiy issiqxona effektisiz Yer taxminan qancha sovuqroq bo‘lardi?"],["1 °C","10 °C","33 °C","100 °C"],2),
 Q(["Climate refers to…","Климат — это…","Iqlim bu…"],[["patterns over decades","закономерности за десятилетия","o‘nlab yillik qonuniyat"],["today’s forecast","сегодняшний прогноз","bugungi prognoz"],["a single storm","одна буря","bitta bo‘ron"],["next week’s weather","погода на следующую неделю","kelasi haftalik ob-havo"]],0)]},

{slug:'what-is-dna',cat:'biology',cats:['biology','medicine'],ill:'dna',
 t:["What Is DNA?","Что такое ДНК?","DNK nima?"],
 d:["A four-letter code, three billion letters long, that builds and runs every living thing.","Четырёхбуквенный код длиной в три миллиарда букв, который строит и управляет всем живым.","To‘rt harfli, uch milliard harf uzunlikdagi kod — har bir tirik mavjudotni quradi va boshqaradi."],
 b:[H("The molecule of life","Молекула жизни","Hayot molekulasi"),
 Pp("DNA is a long molecule shaped like a twisted ladder, the double helix, described in 1953 by James Watson and Francis Crick, using X-ray data from Rosalind Franklin and Maurice Wilkins. Its rungs are made of four bases: A, T, C and G.","ДНК — длинная молекула в форме закрученной лестницы, двойной спирали, описанная в 1953 году Джеймсом Уотсоном и Фрэнсисом Криком с использованием рентгеновских данных Розалинд Франклин и Мориса Уилкинса. Её перекладины состоят из четырёх оснований: A, T, C и G.","DNK — buralgan narvonga o‘xshash uzun molekula, qo‘sh spiral; uni 1953-yilda Jeyms Uotson va Frensis Krik Rozalind Franklin va Moris Uilkinsning rentgen ma’lumotlaridan foydalanib tasvirlagan. Uning pog‘onalari to‘rtta asosdan iborat: A, T, C va G."),
 H("Genes and proteins","Гены и белки","Genlar va oqsillar"),
 Pp("The human genome has about three billion base pairs and roughly 20,000 protein-coding genes. Genes are instructions for making proteins, the molecules that do most of the work in cells. Nearly every cell in your body carries the same DNA.","Геном человека содержит около трёх миллиардов пар оснований и примерно 20 000 генов, кодирующих белки. Гены — инструкции по созданию белков, молекул, выполняющих большую часть работы в клетках. Почти в каждой клетке вашего тела одна и та же ДНК.","Inson genomida taxminan uch milliard asos juftligi va oqsillarni kodlaydigan taxminan 20 000 gen bor. Genlar — hujayralarda ishning ko‘pini bajaradigan oqsillarni yaratish ko‘rsatmalari. Tanangizdagi deyarli har bir hujayrada bir xil DNK bor."),
 H("Reading and editing","Чтение и редактирование","O‘qish va tahrirlash"),
 Pp("The first human genome was completed in 2003, and sequencing has become far cheaper since. Tools such as CRISPR now let scientists edit DNA precisely, raising both hopes for treating genetic diseases and important ethical questions.","Первый геном человека был прочитан в 2003 году, а секвенирование с тех пор сильно подешевело. Инструменты вроде CRISPR позволяют точно редактировать ДНК, что даёт надежды на лечение наследственных болезней и поднимает важные этические вопросы.","Birinchi inson genomi 2003-yilda o‘qib bo‘lingan, o‘shandan beri sekvenirlash ancha arzonlashgan. CRISPR kabi vositalar DNKni aniq tahrirlashga imkon beradi, bu irsiy kasalliklarni davolash umidini ham, muhim axloqiy savollarni ham tug‘diradi."),
 Cc("Fun fact: Humans share about 99.9% of their DNA with every other human.","Забавный факт: У любых двух людей совпадает около 99,9% ДНК.","Qiziq fakt: Har qanday ikki odamning DNKsi taxminan 99,9% bir xil.")],
 q:[Q(["What shape is DNA?","Какую форму имеет ДНК?","DNK qanday shaklga ega?"],[["Double helix","Двойная спираль","Qo‘sh spiral"],["Single circle","Одиночное кольцо","Yagona halqa"],["Flat sheet","Плоский лист","Yassi varaq"],["Cube","Куб","Kub"]],0),
 Q(["How many letters (bases) are in the DNA alphabet?","Сколько «букв» (оснований) в алфавите ДНК?","DNK alifbosida nechta “harf” (asos) bor?"],["2","4","8","20"],1),
 Q(["Roughly how many protein-coding genes do humans have?","Примерно сколько генов, кодирующих белки, у человека?","Odamda taxminan nechta oqsil kodlovchi gen bor?"],["~200","~2,000","~20,000","~2,000,000"],2)]},

{slug:'why-we-sleep',cat:'psychology',cats:['psychology','medicine','biology'],ill:'moon',
 t:["Why Do We Sleep?","Зачем мы спим?","Biz nima uchun uxlaymiz?"],
 d:["Sleep is not wasted time. It is when your brain and body do some of their most important work.","Сон — не потерянное время. Именно тогда мозг и тело выполняют важнейшую работу.","Uyqu behuda vaqt emas. Aynan shunda miya va tana eng muhim ishlarini bajaradi."],
 b:[H("Cycles of the night","Циклы ночи","Tun sikllari"),
 Pp("Sleep moves through repeating cycles of about 90 minutes, from light sleep to deep slow-wave sleep to REM sleep, when most vivid dreaming happens. A healthy night has four to six cycles.","Сон проходит повторяющимися циклами примерно по 90 минут: от лёгкого сна к глубокому медленноволновому и к REM-фазе, когда видятся самые яркие сны. В здоровую ночь бывает от четырёх до шести циклов.","Uyqu taxminan 90 daqiqalik takrorlanuvchi sikllardan o‘tadi: yengil uyqudan chuqur sekin to‘lqinli uyquga va eng yorqin tushlar ko‘riladigan REM bosqichiga. Sog‘lom tunda to‘rt-olti sikl bo‘ladi."),
 H("What sleep does","Что делает сон","Uyqu nima qiladi"),
 Pp("During sleep the brain consolidates memories, and the body repairs tissue and regulates hormones. Researchers also describe a cleanup system that helps clear waste products from the brain. Lack of sleep harms attention, mood and health.","Во сне мозг закрепляет воспоминания, а тело восстанавливает ткани и регулирует гормоны. Исследователи также описывают систему очистки, помогающую выводить из мозга продукты обмена. Недостаток сна вредит вниманию, настроению и здоровью.","Uyquda miya xotiralarni mustahkamlaydi, tana to‘qimalarni tiklaydi va gormonlarni tartibga soladi. Tadqiqotchilar miyadan chiqindi moddalarni tozalashga yordam beruvchi tizimni ham tasvirlaydi. Uyqu yetishmasligi diqqat, kayfiyat va salomatlikka zarar yetkazadi."),
 H("How much do you need?","Сколько нужно?","Qancha kerak?"),
 Pp("Most adults need seven or more hours a night, while teenagers and children need more. Regular bedtimes, dim lights in the evening and avoiding screens right before bed help many people sleep better.","Большинству взрослых нужно семь и более часов в ночь, подросткам и детям — больше. Регулярное время отхода ко сну, приглушённый свет вечером и отказ от экранов прямо перед сном помогают многим спать лучше.","Ko‘pchilik kattalarga tunda yetti soat yoki ko‘proq kerak, o‘smirlar va bolalarga esa ko‘proq. Muntazam yotish vaqti, kechqurun xira yorug‘lik va uxlashdan oldin ekranlardan voz kechish ko‘pchilikka yaxshiroq uxlashga yordam beradi."),
 Cc("Tip: If sleep problems last for weeks, talk to a doctor rather than relying on guesswork.","Совет: Если проблемы со сном длятся неделями, обратитесь к врачу, а не полагайтесь на догадки.","Maslahat: Uyqu muammolari haftalab davom etsa, taxminga tayanmay, shifokorga murojaat qiling.")],
 q:[Q(["About how long is one sleep cycle?","Сколько примерно длится один цикл сна?","Bitta uyqu sikli taxminan qancha davom etadi?"],[["30 min","30 мин","30 daq"],["90 min","90 мин","90 daq"],["3 h","3 ч","3 soat"],["6 h","6 ч","6 soat"]],1),
 Q(["In which stage do the most vivid dreams happen?","В какой фазе бывают самые яркие сны?","Eng yorqin tushlar qaysi bosqichda ko‘riladi?"],["REM",["Deep slow-wave","Глубокий медленноволновой","Chuqur sekin to‘lqinli"],["Light","Лёгкий","Yengil"],["Awake","Бодрствование","Uyg‘oqlik"]],0),
 Q(["How many hours do most adults need?","Сколько часов нужно большинству взрослых?","Ko‘pchilik kattalarga necha soat kerak?"],["3–4","5","7+","12"],2)]},

{slug:'thinking-like-a-programmer',cat:'programming',cats:['programming','technology','mathematics'],ill:'code',
 t:["Thinking Like a Programmer","Мыслить как программист","Dasturchidek fikrlash"],
 d:["Programming is less about typing code and more about breaking problems into clear steps.","Программирование — это не столько набор кода, сколько разбиение задач на понятные шаги.","Dasturlash kod terishdan ko‘ra, muammoni aniq qadamlarga bo‘lish haqida."],
 b:[H("Break the problem down","Разбейте задачу","Muammoni bo‘laklarga bo‘ling"),
 Pp("A computer follows instructions exactly, so a programmer breaks a goal into tiny, unambiguous steps. Making a sandwich becomes: get bread, open jar, spread, close. This habit is called decomposition, and it is the heart of computational thinking.","Компьютер выполняет инструкции точно, поэтому программист разбивает цель на крошечные однозначные шаги. Приготовление бутерброда превращается в: взять хлеб, открыть банку, намазать, закрыть. Эта привычка называется декомпозицией и лежит в основе алгоритмического мышления.","Kompyuter ko‘rsatmalarni aynan bajaradi, shuning uchun dasturchi maqsadni mayda, aniq qadamlarga bo‘ladi. Buterbrod tayyorlash: non ol, bankani och, surt, yop, ko‘rinishiga keladi. Bu odat dekompozitsiya deyiladi va hisoblash tafakkurining asosi."),
 H("Four building blocks","Четыре кирпичика","To‘rtta qurilish bloki"),
 Ll([["Variables store information, like a labeled box.","Переменные хранят информацию, как подписанные коробки.","O‘zgaruvchilar ma’lumotni yozuvli quti kabi saqlaydi."],["Conditions let a program choose: if it is raining, take an umbrella.","Условия позволяют выбирать: если идёт дождь, взять зонт.","Shartlar dasturga tanlash imkonini beradi: yomg‘ir yog‘sa, soyabon ol."],["Loops repeat actions without rewriting them.","Циклы повторяют действия без переписывания.","Sikllar harakatlarni qayta yozmasdan takrorlaydi."],["Functions package steps so you can reuse them.","Функции упаковывают шаги для повторного использования.","Funksiyalar qadamlarni qayta ishlatish uchun paketlaydi."]]),
 H("Bugs are normal","Ошибки — это нормально","Xatolar — oddiy hol"),
 Pp("Every programmer writes bugs. The famous story of a moth found in the Harvard Mark II computer in 1947 popularized the word. Debugging means testing, reading error messages and changing one thing at a time. Consistent practice beats talent.","Каждый программист пишет ошибки. Знаменитая история о мотыльке, найденном в компьютере Harvard Mark II в 1947 году, популяризовала это слово. Отладка — это тестирование, чтение сообщений об ошибках и изменение по одной вещи за раз. Регулярная практика важнее таланта.","Har bir dasturchi xato (bag) yozadi. 1947-yilda Harvard Mark II kompyuteridan topilgan kuya haqidagi mashhur voqea bu so‘zni mashhur qilgan. Nosozliklarni tuzatish — sinash, xato xabarlarini o‘qish va bir vaqtda bitta narsani o‘zgartirish demak. Muntazam mashq iqtidordan ustun."),
 Cc("Start today: Pick a free course from our Tech & AI page and write one small program every day for a week.","Начните сегодня: Выберите бесплатный курс на странице «Технологии и ИИ» и пишите одну маленькую программу каждый день в течение недели.","Bugun boshlang: “Texnologiya va SI” sahifasidan bepul kursni tanlang va bir hafta davomida har kuni bitta kichik dastur yozing.")],
 q:[Q(["What is decomposition?","Что такое декомпозиция?","Dekompozitsiya nima?"],[["Breaking a problem into smaller steps","Разбиение задачи на более мелкие шаги","Muammoni kichikroq qadamlarga bo‘lish"],["Deleting code","Удаление кода","Kodni o‘chirish"],["Compressing files","Сжатие файлов","Fayllarni siqish"],["Typing fast","Быстрый набор текста","Tez terish"]],0),
 Q(["Which block repeats an action?","Какой элемент повторяет действие?","Qaysi blok harakatni takrorlaydi?"],[["Loop","Цикл","Sikl"],["Variable","Переменная","O‘zgaruvchi"],["Comment","Комментарий","Izoh"],["Import","Импорт","Import"]],0),
 Q(["What is debugging?","Что такое отладка?","Nosozliklarni tuzatish (debugging) nima?"],[["Finding and fixing errors","Поиск и исправление ошибок","Xatolarni topish va tuzatish"],["Writing the first line","Написание первой строки","Birinchi qatorni yozish"],["Buying a computer","Покупка компьютера","Kompyuter sotib olish"],["Deleting a program","Удаление программы","Dasturni o‘chirish"]],0)]}
];

 {q:["What is machine learning?","Что такое машинное обучение?","Mashinaviy o‘rganish nima?"],a:["Instead of following hand-written rules, a system finds patterns in examples. Show it thousands of labeled photos of cats and dogs and it learns features that separate them.","Вместо ручных правил система находит закономерности в примерах. Покажите ей тысячи размеченных фото кошек и собак, и она научится их различать.","Qo‘lda yozilgan qoidalar o‘rniga tizim misollardan qonuniyat topadi. Unga minglab teglangan mushuk va it suratlarini ko‘rsatsangiz, ularni ajratishni o‘rganadi."]},
 {q:["How does a neural network learn?","Как учится нейронная сеть?","Neyron tarmoq qanday o‘rganadi?"],a:["Layers of simple units joined by adjustable weights. After each guess it measures the error and tweaks the weights to shrink it, using backpropagation. Repeat millions of times.","Слои простых элементов, связанных настраиваемыми весами. После каждой попытки сеть измеряет ошибку и слегка меняет веса, чтобы её уменьшить, — это обратное распространение ошибки. Повторите миллионы раз.","Sozlanadigan og‘irliklar bilan bog‘langan oddiy elementlar qatlamlari. Har bir taxmindan keyin xatoni o‘lchab, uni kamaytirish uchun og‘irliklarni sal o‘zgartiradi — bu teskari tarqalish. Millionlab marta takrorlanadi."]},

 {q:["Can robots think?","Могут ли роботы мыслить?","Robotlar fikrlay oladimi?"],a:["Most robots sense, decide and act, often on one narrow task. They do not understand the world the way people do.","Большинство роботов воспринимают, решают и действуют, часто в одной узкой задаче. Они не понимают мир так, как люди.","Ko‘pchilik robotlar sezadi, qaror qiladi va harakat qiladi, ko‘pincha bitta tor vazifada. Ular dunyoni odamlardek tushunmaydi."]},

/* ================= hero network animation ================= */
function startNet(cv){
  var ctx=cv.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W,H,nodes=[],mx=-9999,my=-9999,raf=0,alive=true,visible=true;
  function size(){
    var r=cv.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
    W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    var n=Math.min(90,Math.round(W*H/15000)),rd=rng('knowly-net');nodes=[];
    for(var i=0;i<n;i++)nodes.push({x:rd()*W,y:rd()*H,vx:(rd()-.5)*.28,vy:(rd()-.5)*.28,r:rd()*1.5+.8});
    draw();
  }
  function draw(){
    ctx.clearRect(0,0,W,H);var L=135,i,j;
    if(!reduce)nodes.forEach(function(n){n.x+=n.vx;n.y+=n.vy;if(n.x<0||n.x>W)n.vx*=-1;if(n.y<0||n.y>H)n.vy*=-1});
    ctx.lineWidth=1;
    for(i=0;i<nodes.length;i++){
      var a=nodes[i];
      for(j=i+1;j<nodes.length;j++){var b=nodes[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;if(d<L*L){ctx.strokeStyle='rgba(80,150,255,'+(0.3*(1-Math.sqrt(d)/L)).toFixed(3)+')';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
      var ex=a.x-mx,ey=a.y-my,md=Math.sqrt(ex*ex+ey*ey),near=md<170;
      if(near){ctx.strokeStyle='rgba(39,214,242,'+(0.75*(1-md/170)).toFixed(3)+')';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(mx,my);ctx.stroke()}
      ctx.fillStyle=near?'#27D6F2':'rgba(190,210,255,.8)';ctx.beginPath();ctx.arc(a.x,a.y,a.r+(near?1.2:0),0,6.2832);ctx.fill();
    }
  }
  function loop(){if(!alive)return;if(visible)draw();raf=requestAnimationFrame(loop)}
  var host=cv.parentElement;
  function mv(e){var r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;if(reduce)draw()}
  function lv(){mx=-9999;my=-9999;if(reduce)draw()}
  host.addEventListener('pointermove',mv);host.addEventListener('pointerleave',lv);
  window.addEventListener('resize',size);
  var io=null;if('IntersectionObserver' in window){io=new IntersectionObserver(function(en){visible=en[0].isIntersecting});io.observe(host)}
  size();if(!reduce)raf=requestAnimationFrame(loop);
  return function(){alive=false;cancelAnimationFrame(raf);window.removeEventListener('resize',size);host.removeEventListener('pointermove',mv);host.removeEventListener('pointerleave',lv);if(io)io.disconnect()};
}

  $$('.savedN').forEach(function(e){e.textContent=saved.length;e.hidden=!saved.length});

function allQuestions(){var o=[];ARTICLES.forEach(function(a){a.q.forEach(function(q){o.push(q)})});BOOKQ.forEach(function(q){o.push(q)});return o}
function quizById(id){

  if(id.indexOf('a-')===0){var a=artBySlug(id.slice(2));return a?{id:id,title:X(a.t),qs:a.q,art:a}:null}
  if(id.indexOf('cat-')===0){var c=id.slice(4),qs=allQuestions().filter(function(q){return q.c===c});return qs.length>=3?{id:id,title:catName(c)+' · '+_('quiz','тест','test'),qs:shuffle(qs,rng('cat-'+c)).slice(0,6)}:null}

}

/* ================= quiz runner ================= */
function mountQuiz(el,qz){
  var st={i:0,ans:[],done:false},n=qz.qs.length,L='ABCD';
  function score(){var s=0;qz.qs.forEach(function(q,i){if(st.ans[i]===q.a)s++});return s}
  function draw(){
    var h,q,ans,i;
    if(st.done){
      var sc=score(),pct=Math.round(sc/n*100),b=bestOf(qz.id);
      var msg=pct===100?_('Perfect score!','Идеальный результат!','Mukammal natija!'):pct>=67?_('Great job!','Отличная работа!','Ajoyib natija!'):_('Good start — review and try again.','Хорошее начало — повторите материал и попробуйте снова.','Yaxshi boshlanish — takrorlab, qayta urinib ko‘ring.');
      h='<div class="qres">'+ringSVG(sc/n,112,sc+'/'+n)+'<div><h3>'+msg+'</h3><p>'+pct+'% · +'+(sc*5+5)+' XP'+(b!==null?' · '+_('Best: ','Лучший: ','Eng yaxshi: ')+b+'%':'')+'</p></div></div>';
      h+='<div class="saved-note">'+ico('check',16)+_('Result saved to your progress','Результат сохранён в вашем прогрессе','Natija natijalaringizga saqlandi')+'</div><ul class="review">';
      qz.qs.forEach(function(qq,k){var ok=st.ans[k]===qq.a,o=qq.o.map(X);h+='<li><span class="m '+(ok?'ok':'bad')+'">'+(ok?'✓':'✕')+'</span><div>'+esc(X(qq.q))+'<small>'+(ok?esc(o[qq.a]):_('Your answer: ','Ваш ответ: ','Sizning javobingiz: ')+esc(o[st.ans[k]])+' · '+_('Correct: ','Верно: ','To‘g‘ri: ')+esc(o[qq.a]))+'</small></div></li>'});
      h+='</ul><div class="row"><button type="button" class="btn primary" data-q="retry">'+_('Try again','Пройти снова','Qayta urinish')+'</button><a class="btn ghost" href="#/progress">'+_('See my progress','Мой прогресс','Natijalarim')+'</a><a class="btn ghost" href="#/quiz">'+_('More quizzes','Другие тесты','Boshqa testlar')+'</a></div>';
    }else{
      q=qz.qs[st.i];ans=st.ans[st.i];var answered=ans!==undefined,o=q.o.map(X);
      h='<div class="qhead"><span>'+_('Question ','Вопрос ','Savol ')+(st.i+1)+' / '+n+'</span><span>'+esc(catName(q.c))+'</span></div><div class="qprog"><i style="width:'+Math.round((st.i+(answered?1:0))/n*100)+'%"></i></div><div class="qq" id="qq">'+esc(X(q.q))+'</div><div role="group" aria-labelledby="qq">';
      o.forEach(function(t,k){var cls='qopt';if(answered){if(k===q.a)cls+=' ok';else if(k===ans)cls+=' bad'}h+='<button type="button" class="'+cls+'" data-o="'+k+'"'+(answered?' disabled':'')+'><b>'+L[k]+'</b><span>'+esc(t)+'</span></button>'});
      h+='</div><div class="qfoot"><span class="qfb '+(answered?(ans===q.a?'ok':'bad'):'')+'" aria-live="polite">'+(answered?(ans===q.a?_('Correct!','Верно!','To‘g‘ri!'):_('Not quite.','Не совсем.','Deyarli.')):'')+'</span>'+(answered?'<button type="button" class="btn primary small" data-q="next" id="qNext">'+(st.i===n-1?_('See results','Результаты','Natijalar'):_('Next','Далее','Keyingi'))+'</button>':'')+'</div>';
    }
    el.innerHTML='<div class="quiz">'+h+'</div>';
    var nx=$('#qNext',el);if(nx&&nx.focus)nx.focus({preventScroll:true});
  }
  el.onclick=function(e){
    var o=e.target.closest('[data-o]'),b=e.target.closest('[data-q]');
    if(o&&st.ans[st.i]===undefined){st.ans[st.i]=+o.dataset.o;draw();return}
    if(!b)return;
    if(b.dataset.q==='next'){
      if(st.i<n-1){st.i++;draw()}
      else{
        st.done=true;var cm={};qz.qs.forEach(function(q,k){var c=cm[q.c]||(cm[q.c]=[0,0]);c[1]++;if(st.ans[k]===q.a)c[0]++});
        addQuiz({id:qz.id,s:score(),n:n,c:cm});if(qz.art)addRead(qz.art.slug);draw();
      }
    }
    if(b.dataset.q==='retry'){st={i:0,ans:[],done:false};draw()}
  };
  draw();
}

function toggleSpeak(a,btn){
  if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){toast(_('Audio is not supported in this browser','Озвучивание не поддерживается этим браузером','Bu brauzer ovoz chiqarishni qo‘llamaydi'));return}
  if(speakBtn){stopSpeak();return}
  var parts=[X(a.t),X(a.d)];a.b.forEach(function(b){parts.push(Array.isArray(b[1][0])?b[1].map(X).join('. '):X(b[1]))});
  var u=new SpeechSynthesisUtterance(parts.join('. ')),codes={en:'en-US',ru:'ru-RU',uz:'uz-UZ'};u.lang=codes[LANG];
  try{var vs=speechSynthesis.getVoices();if(LANG==='uz'&&!vs.some(function(v){return v.lang.toLowerCase().indexOf('uz')===0}))toast(_('No Uzbek voice found on this device','На этом устройстве нет узбекского голоса','Bu qurilmada o‘zbekcha ovoz topilmadi'))}catch(e){}
  u.onend=function(){stopSpeak()};u.onerror=function(){stopSpeak()};

}
function copyText(t,msg){

}

var T={mins:25,total:0,end:0,remain:0,run:false,iv:null};
function fmtT(s){s=Math.max(0,Math.round(s));var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r}
function tRem(){return T.run?Math.max(0,Math.round((T.end-Date.now())/1000)):(T.remain||T.mins*60)}
function timerStart(){if(T.run)return;if(!T.remain){T.remain=T.mins*60;T.total=T.mins*60}T.end=Date.now()+T.remain*1000;T.run=true;clearInterval(T.iv);T.iv=setInterval(timerTick,500);drawTimer()}
function timerPause(){if(!T.run)return;T.remain=tRem();T.run=false;clearInterval(T.iv);drawTimer()}
function timerReset(){clearInterval(T.iv);T.run=false;T.remain=0;T.total=0;drawTimer()}
function timerSave(){var rem=tRem(),el=T.total?Math.floor((T.total-rem)/60):0;timerReset();if(el>=1)addStudy(el);else toast(_('Less than a minute, nothing to save','Меньше минуты — сохранять нечего','Bir daqiqadan kam — saqlashga hech narsa yo‘q'))}
function timerTick(){
  var rem=tRem();
  if(T.run&&rem<=0){var m=Math.round(T.total/60);clearInterval(T.iv);T.run=false;T.remain=0;T.total=0;addStudy(m);toast(_('Time is up! Take a short break.','Время вышло! Сделайте короткий перерыв.','Vaqt tugadi! Qisqa tanaffus qiling.'));drawTimer();return}
  paintTimer(rem);
}
function paintTimer(rem){
  var t=$('#tmText'),arc=$('#tmArc'),pill=$('#timerPill'),onTimer=current==='tools/timer';
  if(t)t.textContent=fmtT(rem);
  if(arc){var tot=T.total||T.mins*60,p=T.total?(1-rem/tot):0;arc.setAttribute('stroke-dashoffset',(565.5*(1-p)).toFixed(1))}
  var active=T.run||(T.total>0&&T.remain>0);
  pill.hidden=!active||onTimer;if(!pill.hidden)pill.innerHTML=ico('clock',16)+fmtT(rem);
}
function drawTimer(){
  var box=$('#timerView');
  if(box){
    var wk=0,i,d,td=P.study[today()]||0;for(i=0;i<7;i++){d=new Date();d.setDate(d.getDate()-i);wk+=P.study[ymd(d)]||0}
    box.innerHTML='<div class="tring"><svg viewBox="0 0 200 200" aria-hidden="true"><defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B7BFF"/><stop offset="1" stop-color="#27D6F2"/></linearGradient></defs><circle class="trk" cx="100" cy="100" r="90" fill="none" stroke-width="10"/><circle id="tmArc" cx="100" cy="100" r="90" fill="none" stroke="url(#tg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="565.5" stroke-dashoffset="565.5" transform="rotate(-90 100 100)"/></svg><div class="tm" id="tmText" role="timer">25:00</div></div>'+
    '<div class="presets">'+[15,25,45,60].map(function(m){return '<button type="button" class="chip" data-tm="set" data-v="'+m+'" aria-pressed="'+(T.mins===m)+'"'+(T.run||T.total?' disabled':'')+'>'+m+' '+_('min','мин','daq')+'</button>'}).join('')+'</div>'+
    '<div class="drow" style="justify-content:center">'+(T.run?'<button type="button" class="btn primary" data-tm="pause">'+ico('pause',16)+_('Pause','Пауза','Pauza')+'</button>':'<button type="button" class="btn primary" data-tm="start">'+ico('play',16)+(T.total?_('Resume','Продолжить','Davom etish'):_('Start','Старт','Boshlash'))+'</button>')+(T.total?'<button type="button" class="btn ghost" data-tm="save">'+_('Stop & save','Стоп и сохранить','To‘xtatish va saqlash')+'</button><button type="button" class="btn ghost" data-tm="reset">'+_('Reset','Сбросить','Qayta boshlash')+'</button>':'')+'</div>'+
    '<p style="text-align:center;color:var(--muted);margin-top:18px">'+_('Studied today: ','Сегодня занимались: ','Bugun o‘qildi: ')+'<b style="color:var(--ink)">'+td+' '+_('min','мин','daq')+'</b> · '+_('last 7 days: ','за 7 дней: ','so‘nggi 7 kun: ')+'<b style="color:var(--ink)">'+wk+' '+_('min','мин','daq')+'</b></p>';
  }
  paintTimer(tRem());
