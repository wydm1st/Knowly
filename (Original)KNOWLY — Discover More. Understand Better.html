<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KNOWLY — Discover More. Understand Better.</title>
<meta name="description" content="KNOWLY: a multilingual digital science magazine with explainers, quizzes, books, tools and progress tracking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050A19;--bg2:#091330;--surface:#0D1A3A;--surface2:#13244F;--line:#1E3263;
  --ink:#EAF0FF;--muted:#A6B7DD;--blue:#3B7BFF;--cyan:#27D6F2;--amber:#FFB84D;--ok:#3DDC97;--bad:#FF6B7A;--on-accent:#04101F;
  --head-bg:rgba(5,10,25,.82);--shadow:0 26px 50px -30px rgba(0,0,0,.9);
  --serif:"Literata","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#F3F6FF;--bg2:#E8EEFF;--surface:#FFFFFF;--surface2:#EEF3FF;--line:#CBD7F2;
  --ink:#0B1630;--muted:#475A85;--blue:#1F55E0;--cyan:#087C98;--amber:#B86E00;--ok:#0E9F6E;--bad:#D9344A;--on-accent:#FFFFFF;
  --head-bg:rgba(243,246,255,.9);--shadow:0 26px 50px -34px rgba(20,40,100,.4);
}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 520px at 92% -6%,rgba(59,123,255,.16),transparent 60%),radial-gradient(700px 520px at -6% 45%,rgba(39,214,242,.08),transparent 60%)}
a{color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:6px}
.wrap{width:min(1200px,100% - 40px);margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--cyan);color:var(--on-accent);padding:10px 16px;z-index:100;border-radius:8px}
.skip:focus{left:12px}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;letter-spacing:-.012em;margin:0}
p{margin:0}
.ico{flex:none;vertical-align:-2px}

/* reading bar */
.rbar{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:3px;z-index:60;background:transparent;pointer-events:none}
.rbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan))}

/* header */
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--head-bg);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line)}
.bar.wrap{width:min(1360px,100% - 32px)}
.bar{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;order:0;margin-right:6px}
.brand .word{font-family:var(--serif);font-weight:700;font-size:24px;letter-spacing:.1em}
.bar nav{order:1;flex:1;display:flex;gap:1px;justify-content:center;align-items:center}
.bar nav a{text-decoration:none;font-size:14.5px;font-weight:600;color:var(--muted);padding:8px 10px;border-radius:9px;position:relative;white-space:nowrap}
.bar nav a:hover{color:var(--ink);background:var(--surface2)}
.bar nav a[aria-current="page"]{color:var(--ink)}
.bar nav a[aria-current="page"]::after{content:"";position:absolute;left:10px;right:10px;bottom:1px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.nav-extra{display:none}
.rcl{order:2;display:flex;gap:8px;align-items:center}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:11px;padding:2px;background:var(--surface)}
.lang button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:800;padding:6px 10px;border-radius:9px;cursor:pointer;letter-spacing:.02em}
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed="true"]{background:linear-gradient(135deg,var(--blue),var(--cyan));color:var(--on-accent)}
.iconbtn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink);text-decoration:none;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.iconbtn:hover{border-color:var(--cyan)}
.iconbtn .n{background:var(--blue);color:#fff;border-radius:99px;padding:0 7px;font-size:12px;line-height:19px;min-width:19px;text-align:center}
.iconbtn.fire svg{color:var(--amber)}
.menu-btn{display:none;order:3;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
@media(max-width:1400px){
  .bar nav{display:none;order:5;flex-basis:100%;flex-direction:column;align-items:stretch;padding:6px 0 12px}
  header.site.open .bar nav{display:flex}
  .bar nav a{padding:12px 10px;font-size:16px}
  .bar nav a[aria-current="page"]::after{left:10px;right:auto;width:26px;bottom:6px}
  .menu-btn{display:inline-block}
  .brand{margin-right:auto}
  .rcl .x{display:none}
  .nav-extra{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0 0;border-top:1px solid var(--line);margin-top:6px}
  .bar nav .nav-extra .iconbtn{font-size:14px;padding:0 12px}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 20px;font:inherit;font-weight:700;font-size:15.5px;text-decoration:none;cursor:pointer;border:1px solid transparent;transition:transform .15s ease,box-shadow .15s ease}
.btn.primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:var(--on-accent);box-shadow:0 12px 28px -14px var(--blue)}
.btn.primary:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--cyan)}
.btn.small{padding:8px 14px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* hero (always dark) */
.hero{position:relative;overflow:hidden;color:#EAF0FF;background:radial-gradient(900px 520px at 85% -10%,rgba(59,123,255,.34),transparent 65%),radial-gradient(700px 420px at 0% 110%,rgba(39,214,242,.16),transparent 60%),#040918}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(130,165,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(130,165,255,.06) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 30% 40%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 30% 40%,#000 20%,transparent 75%)}
#net{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-grid{position:relative;display:grid;grid-template-columns:1.25fr .75fr;gap:52px;align-items:center;padding-block:clamp(48px,7vw,100px) clamp(36px,5vw,64px)}
.hero-tag{color:#6FE4F7;font-weight:700;font-size:16px;margin-bottom:16px}
.hero h1{font-size:clamp(44px,7vw,92px);line-height:1;font-weight:500;letter-spacing:-.03em;margin-bottom:24px}
.hero h1 em{font-style:italic;color:#6FE4F7;font-weight:400}
.hero-lead{font-size:clamp(17px,1.9vw,20px);color:#B9C8F0;max-width:34em;margin-bottom:26px}
.hero-search{display:flex;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(150,180,255,.3);border-radius:16px;padding:6px;max-width:540px;margin-bottom:18px}
.hero-search input{flex:1;min-width:0;background:transparent;border:0;color:#EAF0FF;font:inherit;padding:10px 14px;outline:none}
.hero-search input::placeholder{color:#8EA2D2}
.hero-search:focus-within{border-color:#27D6F2}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:32px}
.hero .btn.ghost{color:#EAF0FF;border-color:rgba(150,180,255,.38)}
.hero-stats{display:flex;gap:30px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.hero-stats b{display:block;font-family:var(--serif);font-size:34px;font-weight:600;line-height:1.1}
.hero-stats span{color:#9DB0DE;font-size:14px}
.glass{background:rgba(12,24,54,.68);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(130,165,255,.3);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:14px;color:#EAF0FF}
.glass h2{font-size:24px;line-height:1.2}
.glass .sub{color:#B9C8F0;font-size:15px}
.today-top{display:flex;align-items:center;gap:16px}
.today-top .ring{flex:none}
.pillrow{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 12px;font-size:13.5px;font-weight:700;background:rgba(255,255,255,.08);border:1px solid rgba(150,180,255,.25)}
.pill svg{color:var(--amber)}
.ticker{position:relative;border-block:1px solid rgba(130,165,255,.2);background:rgba(4,9,24,.6);overflow:hidden;white-space:nowrap}
.ticker .track{display:inline-flex;gap:46px;padding:12px 0;animation:tick 70s linear infinite}
.ticker:hover .track{animation-play-state:paused}
.ticker a{color:#C9D6F7;text-decoration:none;font-size:14.5px;display:inline-flex;gap:10px;align-items:center}
.ticker a:hover{color:#6FE4F7}
.ticker a::before{content:"";width:6px;height:6px;border-radius:50%;background:#27D6F2}
@keyframes tick{to{transform:translateX(-50%)}}
@media(max-width:940px){.hero-grid{grid-template-columns:1fr;gap:34px}}

/* sections */
section.s{padding-block:clamp(40px,6vw,80px)}
section.s.alt{background:var(--bg2);border-block:1px solid var(--line)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(28px,3.8vw,42px);line-height:1.1}
.sec-head p{color:var(--muted);max-width:40em;margin-top:8px}
.more{color:var(--cyan);font-weight:700;text-decoration:none;white-space:nowrap}
.more:hover{text-decoration:underline;text-underline-offset:4px}
.page-head{padding-block:clamp(40px,5.5vw,76px) 28px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--bg2),transparent)}
.page-head h1{font-size:clamp(36px,5.8vw,66px);line-height:1.04;margin-bottom:12px}
.page-head p{color:var(--muted);font-size:18px;max-width:42em}
.crumbs{font-size:14px;color:var(--muted);margin-bottom:14px}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--cyan)}
.jsr [data-r]{opacity:0;transform:translateY(20px);transition:opacity .6s ease,transform .6s ease}
.jsr [data-r].in{opacity:1;transform:none}

/* grids */
.grid{display:grid;gap:24px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.g4,.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.g4,.g3,.g2{grid-template-columns:1fr}}

/* cards */
.card{background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 86%,var(--bg)));border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
.card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--cyan) 65%,var(--line));box-shadow:var(--shadow)}
.thumb{display:block;position:relative;aspect-ratio:16/9;overflow:hidden;background:#08122E}
.thumb svg,.art{position:absolute;inset:0;width:100%;height:100%;display:block;transition:transform .6s ease}
.card:hover .thumb svg{transform:scale(1.05)}
.card .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:9px;flex:1}
.card h3{font-size:22px;line-height:1.2}
.card h3 a{text-decoration:none}.card h3 a:hover{color:var(--cyan)}
.card p{color:var(--muted);font-size:15.5px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-size:13.5px;font-weight:700;color:var(--cyan)}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700}
.badge.news{background:color-mix(in srgb,var(--cyan) 18%,transparent);color:var(--cyan)}
.badge.edu{background:color-mix(in srgb,var(--blue) 22%,transparent);color:color-mix(in srgb,var(--blue) 55%,var(--ink))}
.badge.done{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.meta{display:flex;gap:6px 14px;align-items:center;color:var(--muted);font-size:13.5px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.meta .ext{margin-left:auto;color:var(--cyan);font-weight:700;text-decoration:none;display:inline-flex;gap:4px;align-items:center}
.meta .ext:hover{text-decoration:underline}
.save{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.save:hover{color:var(--ink);border-color:var(--cyan)}
.save svg{fill:none}
.save[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.save[aria-pressed="true"] svg{fill:currentColor}

/* featured news */
.feature{display:grid;grid-template-columns:1.45fr 1fr;gap:24px}
.lead-news{position:relative;border-radius:22px;overflow:hidden;min-height:430px;display:flex;align-items:flex-end;border:1px solid var(--line);color:#fff;text-decoration:none}
.lead-news .art{z-index:0}
.lead-news::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,8,24,0) 25%,rgba(3,8,24,.93));z-index:1}
.lead-news .in{position:relative;z-index:2;padding:30px;display:flex;flex-direction:column;gap:10px}
.lead-news h3{font-size:clamp(28px,3.4vw,42px);line-height:1.08}
.lead-news p{color:#C8D4F5;max-width:38em}
.lead-news:hover h3{text-decoration:underline;text-underline-offset:5px}
.stack{display:flex;flex-direction:column;gap:14px}
.mini{display:grid;grid-template-columns:116px 1fr;gap:16px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-decoration:none;transition:border-color .2s,transform .2s}
.mini:hover{border-color:var(--cyan);transform:translateX(3px)}
.mini .thumb{aspect-ratio:1/1;border-radius:12px}
.mini h3{font-size:19px;line-height:1.2;margin-block:2px 4px}
.mini .d{color:var(--muted);font-size:13.5px}
@media(max-width:940px){.feature{grid-template-columns:1fr}.lead-news{min-height:340px}}

/* fact + gradient panels */
.gb{border:1px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,color-mix(in srgb,var(--blue) 75%,transparent),color-mix(in srgb,var(--cyan) 55%,transparent)) border-box}
.fact{display:grid;grid-template-columns:auto 1fr auto;gap:30px;align-items:center;padding:34px clamp(22px,4vw,48px);border-radius:24px}
.fact .num{font-family:var(--serif);font-size:clamp(54px,8vw,96px);line-height:1;color:var(--cyan);font-weight:500}
.fact .label{font-weight:700;color:var(--cyan);font-size:15px;margin-bottom:6px}
.fact p.t{font-family:var(--serif);font-size:clamp(20px,2.5vw,29px);line-height:1.32}
@media(max-width:800px){.fact{grid-template-columns:1fr;gap:14px}.fact .num{display:none}}

/* feature tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.tile{display:flex;flex-direction:column;gap:8px;padding:24px;border-radius:20px;text-decoration:none;position:relative;overflow:hidden;transition:transform .25s}
.tile:hover{transform:translateY(-4px)}
.tile .ti{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--cyan));color:var(--on-accent)}
.tile h3{font-size:22px}
.tile p{color:var(--muted);font-size:15px}
@media(max-width:900px){.tiles{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.tiles{grid-template-columns:1fr}}

/* categories + chips */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.cat{display:flex;flex-direction:column;gap:4px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-decoration:none;transition:transform .2s,border-color .2s}
.cat:hover{border-color:var(--cyan);transform:translateY(-3px)}
.cat b{font-family:var(--serif);font-size:21px;font-weight:600;display:flex;align-items:center;gap:10px}
.cat i{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.cat span{color:var(--muted);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.chip{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 15px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chip:hover{color:var(--ink);border-color:var(--cyan)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{padding:16px 18px;border:1px solid var(--line);border-left:4px solid var(--cyan);border-radius:12px;background:var(--surface);color:var(--muted);font-size:15px;margin-bottom:28px}
.note b{color:var(--ink)}
.empty{padding:44px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:26px;margin-bottom:8px}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.gtile{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#06102B}
.gtile:nth-child(1),.gtile:nth-child(6){grid-column:span 2;aspect-ratio:auto}
.gtile svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .8s ease}
.gtile:hover svg{transform:scale(1.07)}
.gtile figcaption{position:absolute;inset:auto 0 0 0;padding:34px 16px 14px;background:linear-gradient(180deg,transparent,rgba(3,8,24,.92));color:#fff}
.gtile b{font-family:var(--serif);font-size:19px;display:block}
.gtile span{font-size:13.5px;color:#C5D2F3}
@media(max-width:900px){.gallery{grid-template-columns:repeat(2,1fr)}.gtile:nth-child(1),.gtile:nth-child(6){grid-column:span 2;aspect-ratio:16/9}}
@media(max-width:520px){.gallery{grid-template-columns:1fr}.gtile:nth-child(n){grid-column:auto;aspect-ratio:4/3}}

/* paths */
.path{padding:22px;border-radius:20px;display:flex;flex-direction:column;gap:12px}
.path h3{font-size:23px}
.pbar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:99px}
.path ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.path li a{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--muted);font-size:15px}
.path li a:hover{color:var(--ink)}
.path .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:var(--on-accent)}
.path li.done .dot{background:var(--ok);border-color:var(--ok)}
.path li.done a{color:var(--ink)}

/* books */
.cover{position:relative;aspect-ratio:2/3;border-radius:3px 10px 10px 3px;overflow:hidden;box-shadow:0 22px 36px -18px rgba(0,0,0,.8);background:#08122E}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7%;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(255,255,255,.08));z-index:3}
.cover .art{z-index:0}
.cover-t{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:space-between;padding:15% 11% 11% 16%;background:linear-gradient(180deg,rgba(3,8,24,.62),rgba(3,8,24,0) 48%,rgba(3,8,24,.78));color:#fff}
.cover-t b{font-family:var(--serif);font-size:clamp(16px,1.8vw,23px);line-height:1.1;font-weight:600}
.cover-t span{font-size:12.5px;color:#D4DEFA}
.book{display:flex;flex-direction:column;gap:14px}
.book .info{display:flex;flex-direction:column;gap:8px}
.book h3{font-size:20px;line-height:1.2}

/* article */

.testbox{margin-top:44px}
.testbox h2{font-size:clamp(26px,3.2vw,34px);margin-bottom:6px}
.testbox>p{color:var(--muted);margin-bottom:18px}

/* quiz */
.quiz{max-width:780px;margin-inline:auto;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:clamp(20px,4vw,36px)}

.qq{font-family:var(--serif);font-size:clamp(22px,3vw,30px);line-height:1.25;margin-bottom:20px}
.qopt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface2);border:1.5px solid var(--line);color:var(--ink);border-radius:14px;padding:13px 16px;font:inherit;font-size:16.5px;cursor:pointer;margin-bottom:10px;transition:border-color .15s,background .15s}

.qopt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--surface2))}

.qres{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.qres h3{font-size:clamp(26px,3.4vw,36px)}

.review{list-style:none;margin:0 0 22px;padding:0;display:flex;flex-direction:column;gap:10px}

/* quiz hub */
.qcard{display:flex;flex-direction:column;gap:8px;padding:22px;border-radius:20px;text-decoration:none}

.chart{width:100%;height:auto;display:block}

.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap}

.mbar{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.mbar .tr{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}

.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

.bdg{padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.bdg .bi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--amber),#FF7A59);color:#1A1100}

.bdg b{font-family:var(--serif);font-size:17px}.bdg span{font-size:13px;color:var(--muted)}
.hist{width:100%;border-collapse:collapse;font-size:14.5px}
.hist th,.hist td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line)}
.hist th{color:var(--muted);font-weight:700;font-size:13px}
textarea.bk{width:100%;min-height:110px;background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
select,input[type=number],input[type=date],input[type=text]{background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
select:focus,input:focus{border-color:var(--cyan);outline:none}

/* tools */
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:26px;padding-bottom:4px}
.tabs a{white-space:nowrap;text-decoration:none;padding:10px 18px;border-radius:12px;border:1px solid var(--line);color:var(--muted);font-weight:700}

.tool{max-width:900px}
.deck{max-width:640px;padding:clamp(24px,4vw,40px);border-radius:26px;display:flex;flex-direction:column;gap:20px}
.deck .n{color:var(--cyan);font-weight:700}
.deck p.t{font-family:var(--serif);font-size:clamp(22px,3vw,30px);line-height:1.32;min-height:6.5em}
.drow{display:flex;gap:10px;flex-wrap:wrap}
.form{display:flex;gap:16px;flex-wrap:wrap;align-items:end;margin-bottom:22px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:var(--muted)}
.prow{display:grid;grid-template-columns:110px 1fr 100px;gap:12px;align-items:center;margin:10px 0}
.prow .tr{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden}
.prow .tr i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.prow b{text-align:right}
.tring{position:relative;width:min(300px,80%);margin:0 auto 18px}
.tring .tm{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:clamp(40px,8vw,58px);font-weight:600}
.presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.timer-pill{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;background:linear-gradient(135deg,var(--blue),var(--cyan));color:var(--on-accent);text-decoration:none;font-weight:800;padding:10px 16px;border-radius:99px;box-shadow:0 14px 30px -12px var(--blue);display:inline-flex;gap:8px;align-items:center}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;font-size:14.5px;box-shadow:0 16px 40px -14px rgba(0,0,0,.6);animation:tin .25s ease}

.site-card{display:grid;grid-template-columns:64px 1fr;gap:18px;padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--surface);transition:transform .2s,border-color .2s}

.sbox input{flex:1;min-width:0;background:transparent;border:0;color:var(--ink);font:inherit;padding:10px 12px;outline:none}
.sbox:focus-within{border-color:var(--cyan)}

footer.site{border-top:1px solid var(--line);background:var(--bg2);padding-block:50px 36px;margin-top:40px}
.fgrid{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:36px}
.fgrid h4{font-size:18px;margin:0 0 12px}
.fgrid a{display:block;color:var(--muted);text-decoration:none;padding:3px 0;font-size:15px}
.fgrid a:hover{color:var(--cyan)}
.fgrid p{color:var(--muted);font-size:15px;max-width:26em;margin-top:10px}
.legal{margin-top:34px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
@media(max-width:800px){.fgrid{grid-template-columns:1fr 1fr}}

@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn,.card,.tile,.mini,.cat,.site-card,.thumb svg,.gtile svg{transition:none}.ticker .track{animation:none}.ticker{overflow-x:auto}.jsr [data-r]{opacity:1;transform:none;transition:none}}

.ring .trk,.tring .trk{stroke:var(--surface2)}
